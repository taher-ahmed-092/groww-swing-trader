[project]
name = "groww-swing-trader"
version = "0.1.0"
description = "AI-driven personal swing trading system for NSE/BSE via Groww. Paper-first."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.2",
    "backtesting>=0.6.5",
    "beautifulsoup4>=4.15.0",
    "growwapi>=1.5.0",
    "langchain>=1.3.4",
    "langchain-anthropic>=1.4.4",
    "langgraph>=1.2.4",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "lxml>=6.1.1",
    "numpy>=2.4.6",
    "pandas<3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.7",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sqlmodel>=0.0.38",
    "ta>=0.11.0",
    "yfinance>=1.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
