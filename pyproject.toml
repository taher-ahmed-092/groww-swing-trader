[project]
name = "groww-swing-trader"
version = "0.1.0"
description = "AI-driven personal swing trading system for NSE/BSE via Groww. Paper-first."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.2",
    "backtesting>=0.6.5",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.136.3",
    "feedparser>=6.0.12",
    "finnhub-python>=2.4.28",
    "growwapi>=1.5.0",
    "httpx>=0.28.1",
    "langchain>=1.3.4",
    "langchain-anthropic>=1.4.4",
    "langgraph>=1.2.4",
    "lxml>=6.1.1",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pandas<3",
    "praw>=7.8.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "python-telegram-bot>=22.7",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "sqlmodel>=0.0.38",
    "ta>=0.11.0",
    "uvicorn[standard]>=0.49.0",
    "yfinance>=1.4.1",
]

[project.optional-dependencies]
# Optional heavy/compiled extras, omitted by default so the base install stays small
# and Android/Termux-friendly. The system runs fully without them (signal combiner
# returns None → judge score stands; FinBERT → keyword fallback).
# Laptop with everything:  uv sync --extra ml --extra nlp
#   ml  — xgboost signal combiner (no Android wheel; also pulls ~300MB nvidia-nccl
#         on Linux; only activates after 30+ closed trades)
#   nlp — local FinBERT via transformers (pulls Rust tokenizers/safetensors)
ml = ["xgboost>=2.0.0"]
nlp = ["transformers>=5.12.0"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
