<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>groww-swing-trader — interactive explainer</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1c2330;--mute:#5d6878;--line:#dfe3ea;--accent:#2457d6;--accent2:#e8eefc;--ok:#1b8a4b;--okbg:#e4f5ea;--bad:#c62d2d;--badbg:#fbe7e7;--warn:#a86a00;--warnbg:#fff3d6;--code:#f0f2f6;--side:#fff;--shadow:0 1px 3px rgba(0,0,0,.08)}
html[data-theme=dark]{--bg:#0f1319;--panel:#171d26;--ink:#e6eaf0;--mute:#9aa6b8;--line:#2a3340;--accent:#7aa2ff;--accent2:#1d2a44;--ok:#4cc27f;--okbg:#14301f;--bad:#ff7b7b;--badbg:#3a1c1c;--warn:#f0b24a;--warnbg:#3a2d12;--code:#0c1016;--side:#131820;--shadow:none}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
#side{position:fixed;inset:0 auto 0 0;width:270px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transition:transform .2s}
#side h1{font-size:15px;margin:0;padding:14px 14px 6px}
#side .sub{padding:0 14px 8px;color:var(--mute);font-size:12px}
#qwrap{padding:0 12px 8px}
#q{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14px}
#nav{overflow:auto;flex:1;padding:4px 8px 16px}
#nav a{display:block;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
#nav a:hover{background:var(--accent2)}
#nav a.on{background:var(--accent2);color:var(--accent);font-weight:600}
#nav a b{display:inline-block;width:22px;color:var(--mute);font-weight:600}
#sidefoot{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:8px}
button{font:inherit;cursor:pointer}
.btn{padding:6px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;font-size:13px}
.btn:hover{border-color:var(--accent)}
#menu{display:none;position:fixed;top:8px;left:8px;z-index:40}
main{margin-left:270px;padding:20px 28px 80px;max-width:1180px}
section{margin-bottom:46px;scroll-margin-top:12px}
section>h2{font-size:24px;margin:0 0 4px;display:flex;align-items:baseline;gap:10px}
section>h2 .n{color:var(--mute);font-size:16px}
.lead{color:var(--mute);margin:0 0 14px}
h3{margin:18px 0 8px;font-size:17px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:10px 0;box-shadow:var(--shadow)}
.card>summary{cursor:pointer;padding:11px 14px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card>summary::-webkit-details-marker{display:none}
.card>summary::before{content:"▸";color:var(--mute);transition:transform .15s}
.card[open]>summary::before{transform:rotate(90deg)}
.card>.body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;box-shadow:var(--shadow)}
.analogy{border-left:4px solid var(--accent);background:var(--accent2);padding:8px 12px;border-radius:0 8px 8px 0;margin:8px 0}
.analogy::before{content:"🧒 ";}
.kv{display:flex;gap:8px;margin:5px 0;flex-wrap:wrap;align-items:baseline}
.kv>.k{min-width:120px;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding-top:2px}
.kv>*:not(.k){flex:1 1 300px;min-width:0}
.kv.warn{background:var(--warnbg);color:var(--warn);padding:4px 8px;border-radius:6px}
.list>.item{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:6px 0}
.ul{margin:2px 0;padding-left:20px}
.src{font:11.5px ui-monospace,Menlo,Consolas,monospace;background:var(--code);color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin:0 2px 2px 0;max-width:100%;overflow-wrap:anywhere;text-align:left}
.src:hover{border-color:var(--accent);color:var(--accent)}
.src.ok{background:var(--okbg);color:var(--ok)}
.srcrow{margin-top:4px}
.cp{font-size:11px;padding:0 5px;border:1px solid var(--line);background:var(--panel);color:var(--mute);border-radius:6px;margin-left:4px}
.cp.ok{color:var(--ok);border-color:var(--ok)}
pre{background:var(--code);padding:10px 12px;border-radius:8px;overflow:auto;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;margin:6px 0;white-space:pre}
details.code{margin:6px 0}
details.code>summary{cursor:pointer;color:var(--accent);font-size:13px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--panel)}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--code);position:sticky;top:0;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--mute)}
td.m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;overflow-wrap:anywhere}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--accent2);color:var(--accent);font-size:12px;margin:1px 3px 1px 0;font-weight:500}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.mute{background:var(--code);color:var(--mute)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{padding:6px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;font-size:13px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{display:none}.panel.on{display:block}
abbr.gl{text-decoration:underline dotted var(--accent);text-underline-offset:3px;cursor:help}
#tip{position:fixed;z-index:60;max-width:300px;background:#10151d;color:#e9eef7;border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.35);display:none;pointer-events:none}
#tip b{color:#9fc0ff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--accent)}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pipe{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.st{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:8px 10px;min-width:118px;text-align:left}
.st small{display:block;color:var(--mute);font-size:11px}
.st.on{border-color:var(--accent);background:var(--accent2)}
.st .num{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;text-align:center;line-height:20px;margin-right:5px}
.sim{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:16px;align-items:start}
.ctl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ctl label{display:block;margin:7px 0 2px;font-size:13px}
.ctl input[type=range]{width:100%}
.ctl select,.ctl input[type=number]{width:100%;padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.ctl output{float:right;font-weight:600;color:var(--accent)}
.ctl fieldset{border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:4px 10px 8px}
.ctl legend{font-size:12px;color:var(--mute);padding:0 4px}
.stg{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--panel);overflow:hidden}
.stg>h4{margin:0;padding:8px 12px;font-size:14px;display:flex;gap:8px;align-items:center;background:var(--code)}
.stg.reject>h4{background:var(--badbg);color:var(--bad)}.stg.flag>h4{background:var(--warnbg);color:var(--warn)}.stg.pass>h4{background:var(--okbg);color:var(--ok)}
.stg .row{padding:6px 12px;border-top:1px solid var(--line);font-size:13.5px}
.stg .row.reject{color:var(--bad)}.stg .row.flag{color:var(--warn)}
.verdict{padding:12px 14px;border-radius:12px;font-weight:600;margin:8px 0}
.verdict.reject{background:var(--badbg);color:var(--bad)}.verdict.pass{background:var(--okbg);color:var(--ok)}
.tl{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.tl table{min-width:900px}
.tl td.h{padding:0;width:26px;min-width:26px;height:24px;border-left:1px solid var(--line);text-align:center;font-size:10px}
.tl td.h.mk{background:rgba(120,140,170,.1)}
.tl td.h.on{background:var(--accent);color:#fff}
.tl td.nm{white-space:nowrap;position:sticky;left:0;background:var(--panel);font-size:12.5px;cursor:pointer;z-index:1}
.tl th.hh{padding:3px 0;text-align:center;font-size:10px;min-width:26px}
.flt{width:100%;max-width:420px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);margin:6px 0}
#results{position:fixed;left:280px;top:64px;width:min(640px,calc(100vw - 300px));background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:60vh;overflow:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50}
#results a{display:block;padding:7px 10px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px}
#results a:hover{background:var(--accent2)}
#results small{color:var(--mute);display:block}
mark{background:#ffe27a;color:#111;border-radius:3px}
svg text{fill:var(--ink);font-size:11px}
.legend span{margin-right:12px}
.hit{outline:3px solid var(--accent);outline-offset:2px}
@media(max-width:860px){#side{transform:translateX(-100%)}#side.open{transform:none}#menu{display:block}main{margin-left:0;padding:54px 12px 60px}#results{left:12px;top:100px;width:calc(100vw - 24px)}.sim{grid-template-columns:1fr}.kv>.k{min-width:100%}}
</style>

3,"title":"Remember past mistakes on this stock","analogy":"Like your mum reminding you 'last time you touched that stove you got burned'.","plain":"Finds the 3 most relevant past trade reflections (same stock first, then same sector) and stores them as text for the AI prompts.","purpose":"Retrieve relevant closed-trade reflections for symbol/sector; backfill knowledge_context if it is empty.","input":["symbol","sector","knowledge_context"],"output":["lessons","knowledge_context","current_step"],"file":"src/orchestrator/graph.py (+ src/memory/lessons.py)","src":"src/orchestrator/graph.py:91","key_functions":[{"name":"lessons_node","what":"calls LessonsRetriever.get_relevant_lessons(symbol, sector) and optionally re-hydrates knowledge_context","src":"src/orchestrator/graph.py:91"},{"name":"LessonsRetriever.get_relevant_lessons","what":"scores closed trades that have a reflection; returns top 3 as 'PAST LESSONS' text","src":"src/memory/lessons.py:32"},{"name":"LessonsRetriever.get_recent_rca_context","what":"latest root-cause rows for symbol/sector (used later by judge and technical, not by this node)","src":"src/memory/lessons.py:62"}],"constants":[{"name":"exact-symbol relevance","value":"100","meaning":"relevance points when the past trade is the same symbol","src":"src/memory/lessons.py:42"},{"name":"same-sector relevance","value":"score += 10","meaning":"relevance points for same sector","src":"src/memory/lessons.py:44","rule":"10"},{"name":"same-signal relevance","value":"5","meaning":"never applies from this node: graph passes no signal argument","src":"src/memory/lessons.py:46"},{"name":"lessons returned","value":"relevant[:3]","meaning":"at most 3 lessons","src":"src/memory/lessons.py:55"},{"name":"knowledge backfill min_confidence","value":"0.3","meaning":"same bar as knowledge_context_node","src":"src/orchestrator/graph.py:100"}],"vetoes":[{"what":"No matching past trade","condition":"no closed trade with reflection shares symbol or sector (relevance 0)","effect":"returns empty string (the code comment says it falls back to recency, but the code returns '')","src":"src/memory/lessons.py:51-53"},{"what":"Kill-switch guard (kill_switch_guard decorator)","condition":"file named by LIMITS.kill_switch_file (\"KILL_SWITCH\", relative to the process cwd) exists","effect":"node body is skipped, an error 'KILL_SWITCH present - halted before <node>' is appended, current_step='halted'; the router then sends the graph to END","src":"src/orchestrator/graph.py:49-60"},{"what":"Router after this node","condition":"state.current_step == 'halted' or the KILL_SWITCH file exists","effect":"conditional edge returns END instead of the next node (analytics_node is therefore also skipped on a halt)","src":"src/orchestrator/graph.py:244-252"}],"to_change":[{"goal":"Show more or fewer lessons","edit":"src/memory/lessons.py LessonsRetriever.get_relevant_lessons (top = relevant[:3])","src":"src/memory/lessons.py:55"},{"goal":"Change what makes a lesson relevant","edit":"src/memory/lessons.py get_relevant_lessons inner function relevance()","src":"src/memory/lessons.py:39"}],"code":"        def relevance(r: TradeRecord) -> int:\n            score = 0\n            if r.symbol == symbol:\n                score += 100  # exact symbol = highest relevance\n            if sector and r.sector and r.sector == sector:\n                score += 10\n            if signal and r.signal and r.signal == signal:\n                score += 5\n            return score","code_src":"src/memory/lessons.py:39-47"},{"id":"scout_node","order":4,"title":"The talent scout","analogy":"A scout who watches 200+ players and writes down the top ten.","plain":"Scores every stock in the watchlist with plain maths (RSI, trend, volume, relative strength) and keeps the top 10. In this graph the stock being traded is already chosen; the scout only supplies its sector.","purpose":"Rank the watchlist (ScoutAgent.scan) and return top-10 candidates; resolve the sector of state['symbol'] mpany's blood pressure (debt), heart (profits) and who owns it (promoters).","plain":"Gathers company numbers (screener.in, then yfinance), instantly rejects dangerous companies, then scores quality 0 to 1. With no API key it uses a fixed rulebook; with a key an AI reads the numbers.","purpose":"Merge screener + yfinance data, run deterministic hard rejects, attach social sentiment, score (rule-based in demo mode, LLM or weekly-batch cache otherwise).","input":["symbol","sector","knowledge_context","lessons"],"output":["fundamental_verdict","current_step"],"file":"src/agents/fundamental/agent.py (+ rule_score.py, ratios.py, src/data/screener.py, src/agents/sentiment/agent.py)","src":"src/orchestrator/graph.py:118","key_functions":[{"name":"FundamentalAgent.analyze","what":"gather -> hard-reject gate -> trend/PE label -> sentiment -> demo score or batch cache or LLM","src":"src/agents/fundamental/agent.py:130"},{"name":"FundamentalAgent._gather","what":"merges screener values over yfinance-derived ratios; normalizes yfinance D/E percent to ratio","src":"src/agents/fundamental/agent.py:64"},{"name":"ScreenerScraper.check_hard_rejects","what":"deterministic disqualifiers, sector-aware for financials","src":"src/data/screener.py:222"},{"name":"rule_based_fundamental_score","what":"0-10 points from ROCE, D/E, growth, promoter, P/E, Piotroski, FCF yield, normalized to 0-1","src":"src/agents/fundamental/rule_score.py:18"},{"name":"FundamentalAgent._apply_sentiment","what":"adds sentiment to verdict; 2+ red flags subtract 0.1 from score","src":"src/agents/fundamental/agent.py:50"}],"constants":[{"name":"promoter pledging hard reject","value":"> 30","meaning":"percent pledged","src":"src/data/screener.py:233"},{"name":"low holding + pledging hard reject","value":"1 <= holding < 25 and pledged is not None and pledged > 15","meaning":"percent","src":"src/data/screener.py:242-243","rule":"1 <= holding < 25 and pledged > 15"},{"name":"financial sectors","value":"{\"Banking\", \" 32"},{"where":"runner.py triday_health_check_job","behavior":"Job returns immediately if the KILL_SWITCH file exists.","src":"runner.py:1366"},{"where":"runner.py daily_forced_summary_job","behavior":"Job returns immediately if the KILL_SWITCH file exists.","src":"runner.py:1379"},{"where":"runner.py scheduler main loop","behavior":"Every 60 s checks the file; if present prints 'KILL_SWITCH detected — halting scheduler.', calls scheduler.shutdown() and exits the loop - so the scheduler stays DEAD after the file is removed until runner.py is restarted.","src":"runner.py:1559-1563"},{"where":"runner.py header docstring","behavior":"States the KILL_SWITCH file halts the runner.","src":"runner.py:9"},{"where":"scripts/run_now.py","behavior":"One-shot run prints 'KILL_SWITCH present — halting' and stops.","src":"scripts/run_now.py:273"},{"where":"scripts/start_everything.py supervisor loop","behavior":"Detects the file and tears all child processes down ('KILL_SWITCH detected — stopping all.').","src":"scripts/start_everything.py:276"},{"where":"Telegram /kill (CommandHandler._kill)","behavior":"Creates the file (Path.touch) and replies 'KILL SWITCH ACTIVE'.","src":"src/notifications/command_handler.py:615"},{"where":"Telegram /reset_kill (CommandHandler._reset_kill)","behavior":"Deletes the file (unlink missing_ok) and replies 'Kill switch cleared.'.","src":"src/notifications/command_handler.py:620"},{"where":"Telegram approval 'kill' button (TelegramNotifier.wait_for_approval)","behavior":"A callback_query 'kill' touches the file, sends 'Kill switch activated.' and returns False (trade not approved).","src":"src/notifications/telegram_bot.py:284-287"},{"where":"src/notifications/telegram_bot.py settings_kill_file","behavior":"Helper returning LIMITS.kill_switch_file for the approval loop.","src":"src/notifications/telegram_bot.py:302"},{"where":"Telegram /status and /health display (read-only)","behavior":"Shows ACTIVE/off or '🚨 KILL SWITCH' status; does not halt anything by itself.","src":"src/notifications/command_handler.py:282"},{"where":"src/notifications/command_handler.py _health (read-only)","behavior":"Reads the file to show status.","src":"src/notifications/command_handler.py:636"},{"where":"dashboard/server.py status payload (read-only)","behavior":"Reports kill_switch boolean to the dashboard; does not halt.","src":"dashboard/server.py:556"},{"where":"scripts/system_health_check.py (read-only)","behavior":"Reports ARMED/ready; does not halt.","src":"scripts/system_health_check.py:124"}],"kill_switch_notes":{"plain":"Create an empty file called KILL_SWITCH in the repo folder and everything stops placing trades; delete it to allow trading again (then restart runner.py, because the scheduler shuts itself down).","analogy":"Like pulling the big red emergency-stop plug on a machine: no settings, just 'plug in = stop'.","no_direct_check_found":"grep for kill_switch finds no direct check in src/learning/*, src/trading/daily_guarantee.py or src/learning simulators; they are protected only via the runner.py job wrappers and (for pipeline-based trades) the graph/checker/broker checks. Not verified whether /trade bypasses are covered beyond always_on_trader.ensure_daily_trades."},"stop_loss":[{"what":"Hard stop distance rule","rule":"stop_loss_pct = 7.0 percent below entry is the loosest stop allowed ('hard stop below entry'); every trade MUST have a stop.","src":"config/risk_limits.py:20-21"},{"what":"Technical agent stop (pipeline/real path)","rule":"Uses indicators['atr_stop'] if 0 < atr_stop < entry; otherwise entry*(1 - 7%/100). Target = entry + (entry - stop) * ratio where ratio = max(target_reward_ratio, 8 * round_trip_cost_pct / stop_distance_pct) (round trip priced at entry*1.06, tier-aware).","src":"src/agents/technical/agent.py:46-70"},{"what":"Resistance cap on target","rule":"Pivot R1 caps the target only if it sits at least min_resistance_distance_ratio (1.5) x stop distance above entry; otherwise the cost-aware target is used.","src":"src/agents/technical/agent.py:88-95"},{"what":"RiskChecker step 3 - stop must exist","rule":"Rejects with 'no stop_price set — every trade requires a stop.' when technical.stop_price is falsy.","src":"src/risk/checker.py:303-306"},{"what":"RiskChecker net R:R gate","rule":"Net R:R after round-trip costs must be >= DIRECTIONAL_MIN_NET_RR (1.5) or PAIRS_MIN_NET_RR (1.15 for pairs trades). net_rr = (gross target move% - cost%) / stop distance%.","src":"src/risk/checker.py:287-301"},{"what":"Judge pre-LLM veto POOR_RISK_REWARD","rule":"Flag raised when gross rr < 1.5; never skipped by any trading mode.","src":"src/judge/evaluator.py:60"},{"what":"GrowwBroker refuses stop-less orders (live)","rule":"place_order raises ValueError if not stop_price ('Every trade MUST have a stop (CLAUDE.md rule 2)').","src":"src/broker/groww.py:56-60"},{"what":"GTT OCO (live)","rule":"After the LIMIT/DELIVERY BUY, GrowwBroker places a SELL GTT with trigger_type='OCO', stop_loss_price=stop_price, target_price=target_price. One leg firing cancels the other (per the code comment). If the OCO call raises, the exception propagates after the entry order has already been sent (no rollback in code).","src":"src/broker/groww.py:79-87","excerpt":{"code":"            oco = self._client.place_gtt_order(\n                trading_symbol=symbol,\n                quantity=quantity,\n                transaction_type=\"SELL\",\n                trigger_type=\"OCO\",\n                stop_loss_price=stop_price,\n                target_price=target_price,","src":"src/broker/groww.py:81-87"}},{"what":"PaperBroker stop handling","rule":"Records stop_price/target_price on the order and position but does NOT validate stop_price or monitor it; paper exits happen in runner.daily_postmarket_job (once a day, 16:00 IST) comparing price <= stop_price / >= target_price.","src":"src/broker/paper.py:43-44","unverified":"PaperBroker itself has no stop trigger loop (read the file in full); real paper closes are the journal path in runner.py."},{"what":"Real-trade exit check (stop/target) - daily","rule":"daily_postmarket_job loads OPEN TradeRecords, fetches price, closes via journal.log_closed when price <= trade.stop_price (stop) or >= trade.target_price (target). Runs Mon-Fri 16:00 IST.","src":"runner.py:629-634","excerpt":{"code":"        hit_stop = trade.stop_price is not None and price <= trade.stop_price\n        hit_target = trade.target_price is not None and price >= trade.target_price\n        if not (hit_stop or hit_target):\n            continue\n\n        closed = journal.log_closed(trade.id, price)","src":"runner.py:629-634"}},{"what":"Startup stale-position check","rule":"At runner boot, any OPEN real trade older than STALE_POSITION_MAX_HOLD_DAYS = 5 triggers a Telegram alert and an immediate price check; closes with close_reason=CLOSE_REASON_STALE_CATCHUP if stop/target already breached. Stale-catchup closes are excluded from the daily-loss circuit breaker.","src":"runner.py:563-567"},{"what":"Tiered stops - hard stop (TIER 1)","rule":"TieredStopManager.calculate_initial_stops: hard_stop = entry - atr_stop_multiplier(default 2.0, from get_adaptive_params) * ATR(14), floored at entry*(1-7%) (never looser than the 7% rule); target = entry + 2*(entry-hard_stop).","src":"src/risk/tiered_stops.py:31-35"},{"what":"Tiered stops - breakeven (TIER 2)","rule":"BREAKEVEN_PCT = 3.0: once price is +3% from entry and current stop < entry, move stop to entry (action BREAKEVEN_STOP).","src":"src/risk/tiered_stops.py:21"},{"what":"Tiered stops - partial exit","rule":"PARTIAL_EXIT_PCT = 5.0: at +5% and not yet partial_exited, action PARTIAL_EXIT ('selling 50%', stop -> breakeven); partial_exit_qty_pct is the literal 50.","src":"src/risk/tiered_stops.py:61-65"},{"what":"Tiered stops - trailing (TIER 3)","rule":"TRAILING_TRIGGER_PCT = 5.0 and TRAILING_FACTOR = 0.5: trail = entry + 0.5*(price-entry); only raised, never lowered (trail > current_stop).","src":"src/risk/tiered_stops.py:75-79"},{"what":"WHO calls the tiered stops","rule":"Only scripts/check_positions.py (manual script) calls TieredStopManager.update_stops_for_held_position and journal.update_position; it only records the new stop / partial_exited flag, it does not place a sell order. The scheduled runner.daily_postmarket_job does NOT use TieredStopManager.","src":"scripts/check_positions.py:77","unverified":"grep over *.py (excluding tests/.venv) finds TieredStopManager referenced only in scripts/check_positions.py and its own module; whether the user runs that script on a schedule is outside the code."},{"what":"Corporate-action stop adjustment","rule":"check_positions.py halves/adjusts current stop for bonus/split via CorporateActionChecker.adjust_stop_for_corporate_action.","src":"scripts/check_positions.py:102"},{"what":"Forced engine (AlwaysOnTrader) stop","rule":"stop = max(entry - 1.5*ATR, entry*0.93) (<=7%); target = entry*(1+max(6%, 8 x intraday round-trip cost%)); trade skipped unless ATR% >= 3 x cost%. Time exit after MAX_HOLD_DAYS = 5.","src":"src/trading/always_on_trader.py:375-381","note":"0.93 is a literal duplicate of the 7% rule, not read from LIMITS."},{"what":"EXPLORER engine stop","rule":"Module constants STOP_PCT = 7.0 and TARGET_RR = 2.0: stop = entry*(1-7%), target = entry*(1+7%*2); closes on stop, target or MAX_HOLD_DAYS = 5.","src":"src/trading/explorer.py:127-128"},{"what":"Momentum/breakout strategy stops","rule":"momentum: max(entry - 2*ATR, entry*(1-7%)); breakout: max(20d-high - ATR, entry*(1-7%)); fallback entry*(1-7%) when ATR missing.","src":"src/strategies/momentum.py:39"}],"cost_model":{"plain":"Every trade pays small fees (taxes, exchange charges, and the price you lose because you cannot buy or sell at the perfect moment). The simulator subtracts all of them so a 'win' that only gains a hair is correctly shown as a loser.","analogy":"Like selling a toy at a school fair: you get the price you asked, minus the table fee, the tax, and the bit you let the buyer haggle off.","constants":[{"name":"SLIPPAGE_BY_TIER","value":"{\"large\": 0.0005, \"mid\": 0.0010, \"small\": 0.0015}","meaning":"Per-side slippage fraction of turnover by market-cap tier (0.05% / 0.10% / 0.15%). Unknown tier falls back to 0.0005 in .get().","src":"src/trading/cost_model.py:19"},{"name":"delivery brokerage","value":"0.0","meaning":"Groww delivery brokerage is zero.","src":"src/trading/cost_model.py:47"},{"name":"intraday brokerage rate","value":"min(20, value * 0.0005) per side","meaning":"min(Rs20, 0.05%) on each of buy and sell value.","src":"src/trading/cost_model.py:44"},{"name":"delivery STT rate","value":"0.001","meaning":"0.1% of total turnover (buy + sell).","src":"src/trading/cost_model.py:48"},{"name":"intraday STT rate","value":"0.00025","meaning":"0.025% of sell value only.","src":"src/trading/cost_model.py:45"},{"name":"exchange charge rate","value":"0.0000297","meaning":"~0.00297% of turnover (NSE).","src":"src/trading/cost_model.py:50"},{"name":"stamp duty rate","value":"0.00015","meaning":"0.015% of buy value only.","src":"src/trading/cost_model.py:51"},{"name":"GST rate","value":"0.18","meaning":"18% of (brokerage + exchange charge).","src":"src/trading/cost_model.py:52"}],"formula_steps":[{"step":"Turnover","detail":"buy_value = entry*qty; sell_value = exit*qty; turnover = buy_value + sell_value.","src":"src/trading/cost_model.py:39-41"},{"step":"Brokerage and STT (delivery vs intraday)","detail":"Intraday: brokerage=min(20, 0.05% buy)+min(20, 0.05% sell), STT=0.025% of sell. Delivery: brokerage 0, STT=0.1% of turnover.","src":"src/trading/cost_model.py:43-48"},{"step":"Exchange, stamp, GST","detail":"exchange=turnover*0.0000297; stamp=buy_value*0.00015; gst=(brokerage+exchange)*0.18.","src":"src/trading/cost_model.py:50-52"},{"step":"Slippage","detail":"slippage = turnover * SLIPPAGE_BY_TIER[tier] (both sides folded into turnover).","src":"src/trading/cost_model.py:53-54"},{"step":"Total and total_pct","detail":"total = sum of six parts; total_pct = round(total / buy_value * 100, 4) (cost as % of ENTRY value); each field rounded to 2 dp in TradeCosts.","src":"src/trading/cost_model.py:56-57"},{"step":"Net P&L %","detail":"net_pnl_pct = round(gross_pnl_pct - costs.total_pct, 3), computed for a quantity of 1 share.","src":"src/trading/cost_model.py:66-71"}],"where_used":[{"what":"RiskChecker net R:R gate (compute_round_trip_costs at target, qty=1, delivery)","src":"src/risk/checker.py:293"},{"what":"TradingJournal.log_closed converts gross to net P&L for real trades (delivery)","src":"src/memory/journal.py:332"},{"what":"Executor adds entry slippage to paper fill_price = signal_price * (1 + SLIPPAGE_BY_TIER[tier])","src":"src/agents/executor/agent.py:103"},{"what":"Judge COSTS_EAT_EDGE style veto uses compute_round_trip_costs on entry->target","src":"src/judge/evaluator.py:204"},{"what":"Forced/explorer/intraday simulators use net_pnl_pct (intraday flag for forced+intraday, delivery for explorer)","src":"src/trading/explorer.py:162"}],"unverified":"Paper entry price gets slippage in executor.py AND the cost model charges slippage on both legs at close (journal.log_closed). Whether TradeRecord.entry_price stores the slipped fill or the signal price (i.e. whether entry slippage is double counted) was not traced.","worked_example":{"command":"cd /home/syed/repos/groww-swing-trader && PYTHONPATH=. .venv/bin/python .claude/scratch/explainer/_cost_probe.py","script_source":"from src.trading.cost_model import compute_round_trip_costs, net_pnl_pct\nentry, exit_, qty = 1000.0, 1060.0, 10\nc = compute_round_trip_costs(entry, exit_, qty, \"mid\")\nprint(c)\ngross = (exit_-entry)/entry*100\nprint(\"gross_pct\", gross, \"net_pct\", net_pnl_pct(gross, entry, exit_, \"mid\"))\nci = compute_round_trip_costs(entry, exit_, qty, \"mid\", is_intraday=True)\nprint(\"intraday\", ci)\n","inputs":{"entry_price":1000.0,"exit_price":1060.0,"quantity":10,"tier":"mid","variant_1":"delivery (is_intraday=False)","variant_2":"intraday (is_intraday=True)"},"printed_output":"TradeCosts(brokerage=0.0, stt=20.6, exchange=0.61, stamp=1.5, gst=0.11, slippage=20.6, total=43.42, total_pct=0.4342)\ngross_pct 6.0 net_pct 5.566\nintraday TradeCosts(brokerage=10.3, stt=2.65, exchange=0.61, stamp=1.5, gst=1.96, slippage=20.6, total=37.63, total_pct=0.3763)","plain_walkthrough":"Buy 10 shares at 1000 (10000 rupees), sell at 1060 (10600). Turnover = 20600. Delivery: STT 0.1% x 20600 = 20.60; exchange 0.00297% x 20600 = 0.61; stamp 0.015% x 10000 = 1.50; GST 18% x 0.61 = 0.11; mid-cap slippage 0.10% x 20600 = 20.60; brokerage 0. Total 43.42 rupees = 0.4342% of the 10000 buy value. Gross gain is 6.0%, so net is 6.0 - 0.4342 = 5.566% (printed 5.566). Intraday variant: STT only on the sell (2.65), but brokerage 10.30 and GST 1.96 appear, total 37.63 (0.3763%)."}},"circuit_breaker":{"plain":"If the real trades closed today have lost more than 6% in total, the system refuses to approve any more real trades until tomorrow.","analogy":"Like a game where you get sent to the bench for the rest of the day if you lose too many points in one afternoon.","threshold":{"name":"daily_loss_limit_pct","value":"-6.0","src":"config/risk_limits.py:45"},"mirrored_as":{"name":"DAILY_LOSS_LIMIT_PCT","value":"LIMITS.daily_loss_limit_pct","src":"src/risk/checker.py:39"},"how_it_trips":"Inside RiskChecker.check step 1b: gather today's REAL closed trades (TradingJournal.get_recent(n=200), closed today, outcome WIN/LOSS, close_reason != stale-catchup). If there is at least one and the sum of their pnl_pct (net) is < -6.0, write today's ISO date into data/cache/daily_loss_halt.txt, send a one-time Telegram alert, and reject with DAILY_LOSS_LIMIT.","how_it_clears":"Automatically when the date changes (is_daily_loss_halted compares the file text to date.today().isoformat()). Also deleted at the start of check() if zero real trades closed today (_clear_spurious_halt_if_no_real_trades). Can be cleared manually by deleting data/cache/daily_loss_halt.txt.","what_it_gates":"Only RiskChecker.check (the real pipeline: scout->...->risk->executor). Because check() is also what the guarantee/pipeline real-trade path calls, any real-trade approval is blocked.","what_it_does_not_gate":"Forced (LIVE_FORCED), EXPLORER, CONTINUOUS_SIM, REPLAY, intraday and short simulations - their P&L never counts and they are not stopped by it (docstrings in always_on_trader.ensure_daily_trades and risk_limits.py). It also does not close open positions, and the gate fires only when check() is called after a closing (it is evaluated lazily, not on a timer).","src":"src/risk/checker.py:219-230","helpers":[{"name":"DAILY_LOSS_HALT_FILE","value":"Path(\"data/cache/daily_loss_halt.txt\")","src":"src/risk/checker.py:40"},{"name":"is_daily_loss_halted","value":"True iff file text == today's ISO date","src":"src/risk/checker.py:132-139"},{"name":"_todays_real_trades","value":"closed today, outcome in (WIN, LOSS), close_reason != CLOSE_REASON_STALE_CATCHUP","src":"src/risk/checker.py:145-159"}],"other_cooldown_advisory":{"plain":"A second, separate, only-advisory cool-down: PerformanceAnalyzer.should_pause_trading says 'pause' after 3 consecutive losses or when total P&L < -15% of starting capital. It sends a Telegram message; it does not set any halt file.","src":"src/analytics/performance.py:274-280","consumers":[{"where":"graph analytics_node","src":"src/orchestrator/graph.py:216"},{"where":"runner.py (weekly_research_job)","src":"runner.py:270"}]},"volatility_circuit_breaker":{"plain":"A different thing with a similar name: it measures how often a stock jumps more than 4.5% in a day and, if often, shrinks the position.","analogy":"Like wearing a smaller backpack when the trail is known to be slippery.","constants":[{"name":"_THRESHOLD","value":"0.045","meaning":"A daily |close-to-close| move above 4.5% counts as a big day.","src":"src/risk/circuit_breaker_check.py:11"},{"name":"window","value":"126","meaning":"df.tail(126) ~ 6 months of trading days.","src":"src/risk/circuit_breaker_check.py:22"},{"name":"HIGH tier","value":"per_month > 2 -> size_factor 0.5","meaning":"Halve position.","src":"src/risk/circuit_breaker_check.py:30"},{"name":"MEDIUM tier","value":"per_month > 1 -> size_factor 0.75","meaning":"Reduce size.","src":"src/risk/circuit_breaker_check.py:32"},{"name":"minimum history","value":"20","meaning":"len(df) < 20 returns the default LOW / 1.0.","src":"src/risk/circuit_breaker_check.py:19"}],"applied_in":"src/risk/checker.py:362","assessed_in":"src/agents/technical/agent.py:183"}},"sector_cap":{"plain":"Never hold more than 2 open trades in the same industry, so one bad sector cannot sink the whole account.","analogy":"Like not putting more than two of your eggs in any one basket.","constants":[{"name":"max_positions_per_sector","value":"2","meaning":"Max concurrent OPEN trades per sector.","src":"config/risk_limits.py:16"}],"how_it_works":"RiskChecker.check step 5b: sector = state['sector']; counts journal.get_open_trades() with the same sector; adds a rejection reason 'Sector cap: already N open <sector> positions (max 2)' when N >= 2.","sector_source":"ALL_STOCKS[symbol]['sector'] in src/data/watchlist.py (LARGE_CAP / MID_CAP / SMALL_CAP dicts map symbol->sector).","src":"src/risk/checker.py:322-333","silent_failure":{"what":"The whole block is wrapped in try/except Exception: pass, so a journal/DB error silently disables the sector cap.","src":"src/risk/checker.py:326-334"},"does_not_cover":"Counts only real TradeRecords from TradingJournal (get_open_trades); forced/explorer/sim positions are not counted. Skipped entirely when state has no 'sector'.","related_open_position_cap":{"name":"max_open_positions","value":"5","src":"config/risk_limits.py:15","enforced":"src/risk/checker.py:317","unverified":"RiskChecker is constructed with open_positions=0 by default (graph risk_node calls RiskChecker() with no args), so this cap only bites if a caller n_sizer.py:67-68"},"position_sizing":{"plain":"Bet more when the past results and the judge's score look good, and less when they do not, but never more than Rs 500 per trade from the sizer, and never so much that a stop-out loses more than 3% of the account.","analogy":"Like deciding how many marbles to wager: more when you have been winning and feel sure, a few when you are unsure.","steps":[{"step":"1. Win rate","detail":"win_rate = journal performance win_rate if total_closed >= MIN_TRADES_FOR_KELLY (5), else DEFAULT_WIN_RATE (0.55).","src":"src/risk/position_sizer.py:45-48"},{"step":"2. Reward:risk","detail":"rr = (target-entry)/(entry-stop), default 2.0 if no stop distance, clamped to [0.5, 5.0].","src":"src/risk/position_sizer.py:50-51"},{"step":"3. Half-Kelly","detail":"kelly = max(0, (W*R - (1-W))/R); half_kelly = kelly/2.","src":"src/risk/position_sizer.py:53-55"},{"step":"4. Confidence multiplier","detail":"confidence_mult = 0.3 + (judge_overall_score/10)*0.7 (judge score defaults 5.0).","src":"src/risk/position_sizer.py:58"},{"step":"5. Regime multiplier","detail":"market_context['size_multiplier'] or 1.0.","src":"src/risk/position_sizer.py:61"},{"step":"6. Raw size and clamp","detail":"raw = half_kelly * confidence_mult * regime_mult * portfolio_value, clamped to [MIN_TRADE_INR 50.0, MAX_TRADE_INR 500.0]; quantity = int(size/entry), at least 1 when size >= 50.","src":"src/risk/position_sizer.py:63-68"},{"step":"7. Volatility circuit-breaker factor","detail":"If technical.circuit_breaker.size_factor < 1 (0.75 or 0.5): size *= factor; quantity = max(1, int(size/entry)).","src":"src/risk/checker.py:362-367"},{"step":"8. Economic-event halving","detail":"If market_context.economic_event_flag is set: size *= 0.5 (literal), quantity = max(1, int(size/entry)).","src":"src/risk/checker.py:371-373"},{"step":"9. Tier multiplier","detail":"tier_params['position_size_multiplier']: large 1.0, mid 0.8, small 0.5 (small is also the fallback for unknown tiers in get_ri gy":"A kid who picks teammates with their eyes closed, so you can see whether your careful picking really helps.","plain":"It opens trades on random watchlist stocks with no entry filters, so its results show what each filter in the other engines is actually worth. It is never throttled and feeds no other engine.","file":"src/trading/explorer.py","src":"src/trading/explorer.py:43-47","status":"active","entry_logic":[{"what":"Halts if KILL_SWITCH exists; only enters during market hours (reuses AlwaysOnTrader._is_market_hours).","src":"src/trading/explorer.py:58-63"},{"what":"slots = min(ENTRIES_PER_CALL, MAX_OPEN - open, MAX_DAILY_TRADES - opened today); slots <= 0 -> reason 'cap'.","src":"src/trading/explorer.py:64-70"},{"what":"Skips symbols already held; samples up to slots*3 symbols from ALL_STOCKS at random; entry price = last close; needs >= 30 price rows.","src":"src/trading/explorer.py:72-79"},{"what":"No indicator filter: it records which gates would have passed (rsi_zone 48-68, adx_trending, supertrend bullish) in trade['filters'] for later analysis.","src":"src/trading/explorer.py:136"},{"what":"Stop = entry*(1-7%), target = entry*(1+7%*2.0) i.e. fixed 7% stop and 2:1 target.","src":"src/trading/explorer.py:127-128"},{"what":"Skips sector, exposure and loss-halt gates by design (module docstring).","src":"src/trading/explorer.py:2-7"}],"exit_logic":[{"what":"close_open_trades on every call: close if price <= stop, price >= target, or elapsed >= MAX_HOLD_DAYS (5).","src":"src/trading/explorer.py:104-106"},{"what":"Outcome: stop -> LOSS at stop; target -> WIN at target; else WIN if price > entry else LOSS at price.","src":"src/trading/explorer.py:155-160"},{"what":"Net P&L uses net_pnl_pct(..., is_intraday=False) (delivery cost model).","src":"src/trading/explorer.py:162"},{"what":"Closed rows appended to explorer_history.json, last 10000 kept.","src":"src/trading/explorer.py:111-113"}],"caps":[{"name":"MAX_OPEN","value":"100","meaning":"Max concurrent open ng/continuous_simulator.py:197-214"},{"what":"_evaluate_signal score: RSI 48-68 +0.30; RSI<35 +0.15 (+0.25 more and strategy_type mean_reversion if entry > MA200); RSI>72 -0.25; UPTREND +0.25; DOWNTREND -0.20; ADX TRENDING +0.20; CHOPPY -0.10; OBV RISING +0.15; supertrend BULLISH +0.10.","src":"src/learning/continuous_simulator.py:331-355"},{"what":"BUY only if score >= tier threshold: large 0.30, mid 0.35, small 0.40 (fixed; AdaptiveThresholds' judge bar is NOT consulted, only logged in VOLATILE regime).","src":"src/learning/continuous_simulator.py:356-358"},{"what":"Needs >= 3 candles after the window end; otherwise the window is skipped.","src":"src/learning/continuous_simulator.py:221-224"}],"exit_logic":[{"what":"Stop = max(entry*0.92, entry - 2*ATR); target = entry + 3*(entry - stop), a fixed 3:1 R:R.","src":"src/learning/continuous_simulator.py:257-259"},{"what":"_check_outcome walks the next <=10 candles: Low<=stop -> LOSS at stop; High>=target -> WIN at target; stop checked first each candle; else time exit at last close (WIN if > entry).","src":"src/learning/continuous_simulator.py:361-371"},{"what":"pnl_pct is GROSS here (exit-entry)/entry; no net_pnl_pct cost deduction is applied.","src":"src/learning/continuous_simulator.py:262"}],"caps":[{"name":"BATCH_SIZE","value":"8","meaning":"Stocks evaluated per run.","src":"src/learning/continuous_simulator.py:49"},{"name":"DAYS_PER_STOCK","value":"3","meaning":"Historical windows per stock (full mode).","src":"src/learning/continuous_simulator.py:50"},{"name":"MIN_WINDOW_GAP","value":"15","meaning":"Jitter bound between window endpoints, in candles.","src":"src/learning/continuous_simulator.py:51"},{"name":"QUARANTINE_THRESHOLD","value":"3","meaning":"Consecutive fetch failures before a symbol is quarantined.","src":"src/learning/continuous_simulator.py:52"},{"name":"QUARANTINE_DAYS","value":"7","meaning":"Days a quarantined symbol is excluded.","src":"src/learning/continuous_simulator.py:53"},{"name":"HISTORY_RETENTION","value":"10000","meaning":"Rows kept in continuous_sim_history.json.","src":"src/learning/continuous_simulator.py:42"},{"name":"signal thresholds","value":"large 0.30 / mid 0.35 / small 0.40","meaning":"Per-tier BUY cutoff on the rule score.","src":"src/learning/continuous_simulator.py:356"},{"name":"new-pattern confidence","value":"0.05 (WIN) / 0.03 (LOSS)","meaning":"A brand new knowledge pattern starts low regardless of first outcome.","src":"src/learning/continuous_simulator.py:395"}],"schedule":[{"job_function":"continuous_sim_job (wrapped by _with_marker; catch-up on startup if market open and last run > 0.5h)","trigger":"cron minute=\"*/30\" (24/7)","src":"runner.py:1506"},{"job_function":"startup catch-up list _CATCHUP_JOBS","trigger":"(\"continuous_sim\", 0.5)","src":"runner.py:124-128"}],"data_written":[{"path":"data/cache/continuous_sim_history.json","what":"One row per simulated window (source 'continuous_sim', timestamp field simulated_at), last 10000.","src":"src/learning/continuous_simulator.py:41"},{"path":"data/cache/continuous_sim_progress.json","what":"Per-symbol last_sim, total_sims, consecutive_failures, quarantined_until.","src":"src/learning/continuous_simulator.py:40"},{"path":"data/journal/trades.db (KnowledgeEntry, category CONTINUOUS_SIM)","what":"pattern id contsim-{tier}-{trend}-rsi{bucket}-adx{signal}.","src":"src/learning/continuous_simulator.py:384-414"},{"path":"data/dossiers/{SYMBOL}.json","what":"record_technical and record_trade for each simulated window.","src":"src/learning/continuous_simulator.py:304-310"}],"data_read":[{"path":"data/cache/continuous_sim_progress.json","what":"Rotation order and quarantine state.","src":"src/learning/continuous_simulator.py:441-447"},{"path":"data/cache/engine_throttle.json (via EngineScorecard.get_mode)","what":"Windows-per-stock throttle.","src":"src/learning/continuous_simulator.py:93-95"},{"path":"6-month daily price history via MarketDataFetcher","what":"Source data for every window.","src":"src/learning/continuous_simulator.py:119"}],"scorecard_rules":[{"what":"In _ENGINE_SOURCES as CONTINUOUS_SIM (all rows in continuous_sim_history.json).","src":"src/analytics/strategy_scorecard.py:56"},{"what":"Throttled by PF like LIVE_FORCED; mode only reduces windows_per_stock (paused still does 1 window so pattern learning never stops).","src":"src/learning/continuous_simulator.py:90-102"},{"what":"Era timestamp comes from 'simulated_at' (split_by_era default ts_keys include it).","src":"src/analytics/era.py:51-53"},{"what":"Weight 0.5 in AdaptiveThresholds regime evidence.","src":"src/memory/adaptive_thresholds.py:41"},{"what":"Merged trade history source 'cont_sim'; used by ML, calibration, drift.","src":"src/analytics/trade_loader.py:35"}],"writes_trade_record":false,"touches_broker":false,"code":"        atr = indicators.get(\"atr_14\") or (entry * 0.02)\n        stop = round(max(entry * 0.92, entry - 2 * atr), 2)\n        target = round(entry + 3 * (entry - stop), 2)  # 3:1 R:R","code_src":"src/learning/continuous_simulator.py:257-259","notes":["continuous_sim_job skips if a scan holds the scan lock and backs off 300 s after a full-batch fetch failure.","'regime' on each row is an MA50 UPTREND/DOWNTREND tag, while 'market_regime' is the real market regime."]},{"id":"REPLAY","title":"Historical replay engine (night school)","analogy":"A student redoing old exam papers: cover the answer, make a guess, then peek to see what was right.","plain":"It walks back through the last months of price history for many stocks, makes a BUY call using only the data before each day, checks the next 5 candles, and records the lesson in the knowledge base. It does not write trade rows.","file":"src/learning/historical_replay.py","src":"src/learning/historical_replay.py:44-50","status":"active","entry_logic":[{"what":"Most-overdue stocks first (progress file stores last replay date per symbol).","src":"src/learning/historical_replay.py:263-274"},{"what":"Per stock: 6 months of daily history, needs >= 60 rows; replay indices step every 3rd candle ending 5 candles before the last, index >= 50, last n_days_each used.","src":"src/learning/historical_replay.py:91-101"},{"what":"_evaluate_signal score: RSI 50-65 +0.25 / 45-50 +0.10 / <35 +0.15 / >72 -0.20; UPTREND +0.25; DOWNTREND -0.30; ADX TRENDING +0.15, CHOPPY -0.10; OBV RISING +0.15; supertrend BULLISH +0.15, BEARISH -0.15; CMF>0.1 +0.10, <-0.1 -0.10.","src":"src/learning/historical_replay.py:151-182"},{"what":"BUY if score >= tier threshold large 0.35 / mid 0.40 / small 0.45; AVOID if score <= -0.20; else SKIP.","src":"src/learning/historical_replay.py:184-190"},{"what":"Regime-stratified variant: find 20-session Nifty windows classified BULL_TRENDING / BEAR_TRENDING / RANGE_BOUND / TRANSITIONAL and replay stocks at those dates (5y history).","src":"src/learning/historical_replay.py:308-345"},{"what":"Regime classifier: return>5% and vol<1.5% -> BULL_TRENDING; return<-5% -> BEAR_TRENDING; |return|<2% and vol<1.5% -> RANGE_BOUND; else TRANSITIONAL.","src":"src/learning/historical_replay.py:315-321"},{"what":"next_regime_to_replay picks the regime furthest below REGIME_RECORDS_TARGET.","src":"src/learning/historical_replay.py:438-442"}],"exit_logic":[{"what":"Stop = entry*(1 - LIMITS.stop_loss_pct/100) (7.0); target = entry + 2*(entry - stop), fixed 2:1.","src":"src/learning/historical_replay.py:113-114"},{"what":"Outcome from next 5 candles: Low<=stop LOSS, High>=target WIN (stop first), else final close vs entry.","src":"src/learning/historical_replay.py:193-205"},{"what":"The outcome only updates the knowledge base (confirm or seed a pattern); no trade row is persisted anywhere.","src":"src/learning/historical_replay.py:125-136"}],"caps":[{"name":"REPLAY_LOOKBACK_DAYS","value":"60","meaning":"Declared lookback; unverified whether read anywhere (only the class attribute was seen).","src":"src/learning/historical_replay.py:48"},{"name":"BATCH_SIZE","value":"15","meaning":"Class attribute; run_batch defaults n_stocks=15 (callers pass 20/30/50).","src":"src/learning/historical_replay.py:49"},{"name":"MIN_REPLAY_INTERVAL_DAYS","value":"7","meaning":"Declared; unverified whether read anywhere.","src":"src/learning/historical_replay.py:50"},{"name":"run_batch defaults","value":"n_stocks=15, n_days_each=5","meaning":"Defaults for the regime-agnostic batch.","src":"src/learning/historical_replay.py:64"},{"name":"off_hours_replay_job batch (market hours)","value":"n_stocks=20, n_days_each=3","meaning":"Lighter batch while market is open.","src":"runner.py:1040"},{"name":"off_hours_replay_job batch (night)","value":"n_stocks=30, n_days_each=5","meaning":"Full batch outside market hours.","src":"runner.py:1042"},{"name":"deep_replay_job batch","value":"n_stocks=50, n_days_each=15","meaning":"Nightly deep replay.","src":"runner.py:1072"},{"name":"regime_replay_job batch","value":"n_stocks=25, n_days_each=3","meaning":"Regime-stratified nightly replay.","src":"runner.py:1090"},{"name":"REGIME_RECORDS_TARGET","value":"100","meaning":"Records per regime considered complete.","src":"src/learning/historical_replay.py:41"},{"name":"new-pattern confidence","value":"0.08 (WIN) / 0.05 (LOSS)","meaning":"Initial confidence of a HISTORICAL_REPLAY pattern.","src":"src/learning/historical_replay.py:249"},{"name":"one update per pattern per day per instance","value":"_updated_today set","meaning":"Prevents inflating a pattern's confidence in one batch.","src":"src/learning/historical_replay.py:234-237"}],"schedule":[{"job_function":"off_hours_replay_job","trigger":"cron hour=\"*/2\" minute=15","src":"runner.py:1496"},{"job_function":"regime_replay_job","trigger":"cron hour=22 minute=45","src":"runner.py:1498"},{"job_function":"deep_replay_job (then also calls daily_lessons_job and rf_train_job)","trigger":"cron hour=23 minute=30","src":"runner.py:1497"},{"job_function":"daily_forced_summary_job reads HistoricalReplayEngine.get_stats for KB count","trigger":"cron s at 9:30, check what they are worth at 3:15, and write down whether it was smart.","plain":"At 9:30 it opens up to 5 pretend intraday positions on real 5-minute data, and at 3:15 PM it closes them all and writes what it learned. It never touches the broker.","file":"src/learning/intraday_simulator.py","src":"src/learning/intraday_simulator.py:39-44","status":"active","entry_logic":[{"what":"Runs only if NSECalendar().is_market_open() (a weekday/holiday date check, not time-of-day).","src":"src/learning/intraday_simulator.py:70-71"},{"what":"Candidates: random 3 large + 3 mid + 2 small caps from ALL_STOCKS (fallback: fixed 10 large caps STOCKS_TO_SIMULATE).","src":"src/learning/intraday_simulator.py:49-65"},{"what":"Stops after 5 positions; needs >= 15 five-minute candles (period 1d, interval 5m).","src":"src/learning/intraday_simulator.py:81-86"},{"what":"Entry rule by regime: BULL_TRENDING/TRANSITIONAL -> RSI 50-68 and trend UPTREND/SIDEWAYS; RANGE_BOUND/VOLATILE -> RSI < 38; any other regime -> RSI < 45.","src":"src/learning/intraday_simulator.py:95-100"},{"what":"Stop = entry*(1 - LIMITS.stop_loss_pct/100); target = entry + 1.2*(entry - stop).","src":"src/learning/intraday_simulator.py:108-109"}],"exit_logic":[{"what":"run_afternoon_exits closes ALL open positions at the afternoon call using the current price (flat at entry if no price).","src":"src/learning/intraday_simulator.py:157-162"},{"what":"target hit -> WIN at target; stop hit -> LOSS at stop; else WIN if current > entry.","src":"src/learning/intraday_simulator.py:164-170"},{"what":"Net P&L via net_pnl_pct(..., is_intraday=True).","src":"src/learning/intraday_simulator.py:178"},{"what":"History file: keeps previous 95 rows then appends the new results (so about 100 plus the latest batch).","src":"src/learning/intraday_simulator.py:205-206"}],"caps":[{"name":"max positions per day","value":"5","meaning":"Loop breaks at 5 opened positions.","src":"src/learning/intraday_simulator.py:81-82"},{"name":"candid ay_simulator.py:149"}],"scorecard_rules":[{"what":"NOT in _ENGINE_SOURCES: no scorecard row and no throttle mode (cannot be paused).","src":"src/analytics/strategy_scorecard.py:51-59"},{"what":"Included in trade_loader merged history as source 'intraday', and in ML/calibration/drift/AdaptiveThresholds sources.","src":"src/analytics/trade_loader.py:33"},{"what":"AdaptiveThresholds tags intraday_sim_history rows as source 'SHORT' (weight 0.4), because the file name has no dedicated tag.","src":"src/memory/adaptive_thresholds.py:52"}],"writes_trade_record":false,"touches_broker":false,"code":"            if regime_name in (\"BULL_TRENDING\", \"TRANSITIONAL\"):\n                should_enter = 50 <= rsi <= 68 and trend in (\"UPTREND\", \"SIDEWAYS\")\n            elif regime_name in (\"RANGE_BOUND\", \"VOLATILE\"):\n                should_enter = rsi < 38  # mean reversion\n            else:\n                should_enter = rsi < 45  # any oversold bounce\n            if not should_enter:","code_src":"src/learning/intraday_simulator.py:95-101","notes":["Module docstring says 'rolling 100-entry history' (line 12); code keeps [-95:] plus the new batch, so the file can briefly exceed 100."]},{"id":"SHORT","title":"Short simulator (SHORT_SIM)","analogy":"A seat on the bus that is reserved and named on the timetable, but when you look, nobody is driving it.","plain":"The scorecard, ML loaders and Telegram all read a file called short_trades_history.json, but no code in this repo writes that file and no scheduled job exists for it. Unverified: whether an older or external process ever produced it.","file":"unverified (no module found; only readers of data/cache/short_trades_history.json exist)","src":"src/analytics/strategy_scorecard.py:57","status":"active","entry_logic":[{"what":"No entry code found: grep for short_trades / SHORT_SIM / ShortSim finds only readers and docstrings, no writer. git log -S for the file name under src/learning and src/trading returned nothing.","src"  but still has to pass it through the real grader.","plain":"It looks for the best available setup and sends it through the REAL judge, risk checker and executor. If the judge or risk says no, it logs a simulation instead of forcing a trade.","file":"src/trading/daily_guarantee.py","src":"src/trading/daily_guarantee.py:39-42","status":"active","entry_logic":[{"what":"Skips if today's executed paper trades (journal.get_recent(80), IST) >= target; target defaults to MIN_DAILY_PAPER_TRADES (1).","src":"src/trading/daily_guarantee.py:141-143"},{"what":"Candidates: pairs trading (top 3 from PairsTradingStrategy.find_opportunities, score = min(|z|/3, 1)) plus sampled mean reversion on the first 25 MID_CAP names with RSI < 38.","src":"src/trading/daily_guarantee.py:77-121"},{"what":"Mean-reversion candidate: stop = entry*0.93, target = entry*1.06, score = (40 - RSI)/40.","src":"src/trading/daily_guarantee.py:113-115"},{"what":"Best = regime-compatible first, then highest score; at most ONE trade per call.","src":"src/trading/daily_guarantee.py:127-131"},{"what":"Builds a state with a BUY technical verdict (score = max(best score, 0.6)) and neutral fundamentals (score 0.55, data_missing True).","src":"src/trading/daily_guarantee.py:160-174"},{"what":"Runs the REAL LLMJudge.evaluate then RiskChecker.check; only then ExecutorAgent().execute.","src":"src/trading/daily_guarantee.py:177-196"}],"exit_logic":[{"what":"If judge or risk rejects it logs a SimulatedTrade (rejection_reason 'judge rejected: ...' / 'risk rejected: ...') and returns outcome 'simulated'.","src":"src/trading/daily_guarantee.py:182-192"},{"what":"If approved the ExecutorAgent places a paper order via the broker (PaperBroker unless broker_mode is live); position exit is handled outside this module (not traced here: unverified).","src":"src/agents/executor/agent.py:25-30"}],"caps":[{"name":"MIN_DAILY_PAPER_TRADES","value":"1","meaning":"Absolute minimum executed paper trades.","src":"src/trading/daily_guarantee.py:40"},{"name":"TARGET_DAILY_TRADES","value":"3","meaning":"Ideal learning volume.","src":"src/trading/daily_guarantee.py:41"},{"name":"_OVERSOLD_SAMPLE","value":"25","meaning":"Mid-caps sampled for mean reversion.","src":"src/trading/daily_guarantee.py:42"},{"name":"RSI cutoff","value":"< 38","meaning":"Oversold test.","src":"src/trading/daily_guarantee.py:106"},{"name":"trades per call","value":"1","meaning":"At most one trade per call to bound network use.","src":"src/trading/daily_guarantee.py:134-138"},{"name":"per-job target args","value":"intraday_scan 999; midmorning 1; midday 3; afternoon 1","meaning":"target passed to ensure_minimum_trades.","src":"runner.py:998-1013"}],"schedule":[{"job_function":"intraday_scan_job (wrapped by _with_marker; catch-up if market open and last run > 0.5h)","trigger":"cron day_of_week=\"mon-fri\" hour=\"9-14\" minute=\"*/30\"","src":"runner.py:1490-1491"},{"job_function":"midmorning_guarantee_job","trigger":"cron day_of_week=\"mon-fri\" hour=10 minute=30","src":"runner.py:1492"},{"job_function":"midday_guarantee_job","trigger":"cron day_of_week=\"mon-fri\" hour=12 minute=30","src":"runner.py:1493"},{"job_function":"afternoon_guarantee_job","trigger":"cron day_of_week=\"mon-fri\" hour=14 minute=0","src":"runner.py:1494"}],"data_written":[{"path":"data/journal/trades.db (TradeRecord via ExecutorAgent journal.log_proposed / log_executed)","what":"Real paper-broker trade when the pipeline approves.","src":"src/agents/executor/agent.py:82-107"},{"path":"data/journal/trades.db (SimulatedTrade)","what":"Rejected candidates logged as simulations.","src":"src/trading/daily_guarantee.py:201-214"},{"path":"data/cache/sim_log_sent_today.json","what":"Dedupe so the same symbol is not re-announced on Telegram per day (written by runner).","src":"runner.py:938-961"}],"data_read":[{"path":"data/journal/trades.db (TradeRecord, get_recent(80))","what":"Today's executed count.","src":"src/trading/daily_guarantee.py:48-56"},{"path":"PairsTradi ified here)","trigger":"per pipeline run","src":"src/orchestrator/graph.py:236"}],"data_written":[{"path":"data/journal/trades.db (SimulatedTrade)","what":"One row per pipeline candidate; outcomes filled later.","src":"src/learning/forward_simulator.py:43-55"},{"path":"data/journal/trades.db (KnowledgeEntry, category SIMULATION_LEARNING)","what":"Insights promoted by runner.","src":"runner.py:664-672"}],"data_read":[{"path":"data/journal/trades.db (SimulatedTrade)","what":"get_simulations for fill and insights.","src":"src/learning/forward_simulator.py:61-99"},{"path":"MarketDataFetcher.get_current_price","what":"Current price for outcome fill.","src":"src/learning/forward_simulator.py:69"}],"scorecard_rules":[{"what":"Not in _ENGINE_SOURCES (no JSON history file); no PF or throttle.","src":"src/analytics/strategy_scorecard.py:51-59"},{"what":"Exempt from the era filter (no era handling on SimulatedTrade rows).","src":"src/analytics/strategy_scorecard.py:109-116"},{"what":"Its rejection-outcome table feeds src/analytics/filter_value.py to show which real gates protect money.","src":"src/learning/forward_simulator.py:93-99"},{"what":"Forced-engine closed trades are mirrored into SimulatedTrade with learned_from=True and outcome_7d set.","src":"src/trading/always_on_trader.py:523-539"}],"writes_trade_record":false,"touches_broker":false,"code":"            if days >= 7 and sim.outcome_7d is None:\n                sim.outcome_7d = round((current - sim.entry_price) / sim.entry_price * 100, 2)\n                would_win = sim.target_price and current >= sim.target_price\n                would_lose = sim.stop_price and current <= sim.stop_price\n                sim.would_have_won = bool(would_win)\n                updated += 1\n                changed = True","code_src":"src/learning/forward_simulator.py:74-80","notes":["From code reading (not run): forced rows set outcome_7d but leave outcome_14d None, and fill_simulation_outcomes never checks learned_from, so its line-6 ":"Setup bonus from KB patterns.","src":"src/memory/auto_rules.py:92"},{"name":"DOSSIER_MIN_TRADES","value":"8","meaning":"Dossier needs this many closed trades to create a rule.","src":"src/memory/auto_rules.py:121"},{"name":"DOSSIER_VETO_WR","value":"30.0","meaning":"Dossier win rate below this (percent) -> stock veto.","src":"src/memory/auto_rules.py:122"},{"name":"DOSSIER_BOOST_WR","value":"65.0","meaning":"Dossier win rate above this (percent) -> stock boost.","src":"src/memory/auto_rules.py:123"},{"name":"seed veto RSI band","value":"\"rsi_min\": 57, \"rsi_max\": 66","meaning":"Hard-coded seed setup veto: RSI 57-66 with ADX CHOPPY, confidence 0.75.","src":"src/memory/auto_rules.py:100"},{"name":"drift look-back","value":"history[-10:]","meaning":"Patterns flagged by the last 10 logged drift checks are never turned into rules.","src":"src/memory/auto_rules.py:170"},{"name":"scout hard-veto cut","value":">= 0.85","meaning":"Scout only skips a stock entirely when the veto confidence is at least 0.85.","src":"src/agents/scout/agent.py:214"}],"to_change":[{"goal":"Make rules easier to create","edit":"Lower MIN_CONFIDENCE / MIN_OBSERVATIONS (and the 0.85 / 0.80 literals) in AutoRuleExtractor.extract_and_save (src/memory/auto_rules.py). Tests: tests/unit/test_auto_rules.py"},{"goal":"Change stock-veto strictness in the scout","edit":"Edit the 0.85 literal and score_penalty = -3 in ScoutAgent._score_symbol (src/agents/scout/agent.py)."}],"tests":["tests/unit/test_auto_rules.py","tests/unit/test_dossier_auto_rules.py","tests/unit/test_auto_rules_telegram_escaping.py"],"code":"    MIN_CONFIDENCE = 0.75\n    MIN_OBSERVATIONS = 10","code_src":"src/memory/auto_rules.py:26-27"},{"id":"adaptive_thresholds","title":"AdaptiveThresholds (per-regime judge bar)","analogy":"A teacher who makes the pass mark a bit harder on days when class keeps failing and a bit easier when class is doing well.","plain":"For each market regime the system remembers how practice trades did: mostly w aptive_thresholds.py:29"},{"name":"SOURCE_WEIGHTS LIVE_FORCED","value":"1.0","meaning":"Weight of live forced trades in the win-rate.","src":"src/memory/adaptive_thresholds.py:40"},{"name":"SOURCE_WEIGHTS CONTINUOUS_SIM","value":"0.5","meaning":"Weight of continuous-sim trades.","src":"src/memory/adaptive_thresholds.py:41"},{"name":"SOURCE_WEIGHTS HISTORICAL_SIM","value":"0.3","meaning":"Weight of historical-sim trades.","src":"src/memory/adaptive_thresholds.py:42"},{"name":"SOURCE_WEIGHTS SHORT","value":"0.4","meaning":"Weight of intraday/short trades.","src":"src/memory/adaptive_thresholds.py:43"},{"name":"win-rate bands","value":"0.60","meaning":"WR > 0.60 lowers the bar, WR < 0.45 raises it, otherwise no change.","src":"src/memory/adaptive_thresholds.py:130"},{"name":"max step","value":"1.5","meaning":"Largest single adjustment (points on the 0-10 judge scale).","src":"src/memory/adaptive_thresholds.py:131"},{"name":"hard clamp","value":"max(5.0, min(9.0,","meaning":"Absolute floor 5.0 and ceiling 9.0 on judge_min.","src":"src/memory/adaptive_thresholds.py:137"},{"name":"judge clamp to mode","value":"mode.judge_threshold - 1.5","meaning":"Judge never lets the adaptive value stray more than 1.5 from the trading-mode bar.","src":"src/judge/evaluator.py:253"}],"to_change":[{"goal":"Change a regime's starting judge bar","edit":"Edit DEFAULT_THRESHOLDS in src/memory/adaptive_thresholds.py (and delete data/cache/adaptive_thresholds.json, which overrides defaults once present)."},{"goal":"Require more evidence before adapting","edit":"Raise MIN_EVIDENCE in src/memory/adaptive_thresholds.py. Tests: tests/unit/test_adaptive_thresholds.py"},{"goal":"Trust simulations less/more","edit":"Edit SOURCE_WEIGHTS in src/memory/adaptive_thresholds.py."}],"tests":["tests/unit/test_adaptive_thresholds.py"],"code":"            if win_rate > 0.60:\n                adjustment = -min(0.5 * (win_rate - 0.60) * 10, 1.5)\n            elif win_rate < 0.45:\n                adjustment = min(0.5 * (0.45 - win_rate) * 10, 1.5)\n            else:\n                adjustment = 0.0\n\n            new_threshold = round(max(5.0, min(9.0, old_threshold + adjustment)), 2)","code_src":"src/memory/adaptive_thresholds.py:130-137"},{"id":"drift_detector","title":"Drift detector (DriftDetector)","analogy":"A smoke alarm for 'the old tricks have stopped working': if recent games go much worse than earlier games, it tells everyone to trust their old notes less.","plain":"Every 6 hours it checks three things: did the win rate fall, did a trusted pattern start failing, did the market regime change. If so it shrinks every pattern's confidence by 20% (at most once a day) and rebuilds the auto-rules.","file":"src/analytics/drift_detector.py","src":"src/analytics/drift_detector.py:49","stores":[{"path_or_table":"data/cache/drift_history.json","what":"Last 100 drift check results that had any_drift (history[-100:])."},{"path_or_table":"data/cache/drift_decay_state.json","what":"{consecutive_wr_drift, last_decay_at} used for the 2-in-a-row rule and the 24h cooldown."}],"written_by":[{"func":"drift_check_job (cron hour=*/6) -> DriftDetector().check_and_respond()","src":"runner.py:1336"},{"func":"scripts/system_health_check.py also calls check_and_respond","src":"scripts/system_health_check.py:114"}],"read_by":[{"func":"AutoRuleExtractor._load_drifted_pattern_ids (skips drifted patterns)","src":"src/memory/auto_rules.py:165"},{"func":"LessonsWriter 'Recently Drifted Patterns' section","src":"src/memory/lessons_writer.py:144"}],"constants":[{"name":"WR_DRIFT_WINDOW","value":"100","meaning":"Trades in each compared window (recent vs previous).","src":"src/analytics/drift_detector.py:32"},{"name":"MIN_TRADES_PER_WINDOW","value":"20","meaning":"Each window needs at least this many trades.","src":"src/analytics/drift_detector.py:33"},{"name":"MIN_RECENT_MATCHES","value":"10","meaning":"Pattern drift needs this many matching recent sims.","src":"src/analytics/drift_detector.py:34"},{"name":"MIN_REGIME_TAGGED_RECORDS","value":"20","meaning":"Regime drift needs this many market_regime-tagged records in the last 50.","src":"src/analytics/drift_detector.py:35"},{"name":"DECAY_COOLDOWN_HOURS","value":"24","meaning":"At most one confidence decay per 24 hours.","src":"src/analytics/drift_detector.py:40"},{"name":"WR drop trigger","value":"prev_wr - 0.15","meaning":"recent_wr must be more than 15 percentage points below previous_wr.","src":"src/analytics/drift_detector.py:156"},{"name":"WR confirmation","value":"wr_streak >= 2","meaning":"WR drift counts only after 2 consecutive detections.","src":"src/analytics/drift_detector.py:82"},{"name":"pattern drift min confidence","value":"entry.confidence < 0.75","meaning":"Only patterns with confidence >= 0.75 are tested for drift.","src":"src/analytics/drift_detector.py:178"},{"name":"pattern drift loss rate","value":"> 0.70","meaning":"3+ losses and loss rate above 70% of matching recent sims.","src":"src/analytics/drift_detector.py:190"},{"name":"regime dominance","value":"dominant_pct > 0.60","meaning":"Regime drift when >60% of recent records are one regime that is not the current one.","src":"src/analytics/drift_detector.py:233"},{"name":"decay factor","value":"entry.confidence * 0.80","meaning":"Each pattern above 0.10 is multiplied by 0.80 (floor 0.05).","src":"src/analytics/drift_detector.py:256"}],"to_change":[{"goal":"Make drift alarms less twitchy","edit":"Raise WR_DRIFT_WINDOW / MIN_* floors or the 0.15 literal in src/analytics/drift_detector.py. Tests: tests/unit/test_drift_detector.py, tests/unit/test_drift_decay_cooldown.py"},{"goal":"Change how often drift is checked","edit":"Edit the drift_check cron (hour=\"*/6\") in the scheduler block of runner.py."}],"tests":["tests/unit/test_drift_detector.py","tests/unit/test_drift_decay_cooldown.py"],"code":"WR_DRIFT_WINDOW = 100        # each WR-drift comparison window, in trades\nMIN_TRADES_PER_WINDOW = 20   # each window needs at least this many (floor, < WR_DRIFT_WINDOW)\nMIN_RECENT_MATCHES = 10      # pattern-drift sample floor (was 3 — too small)\nMIN_REGIME_TAGGED_RECORDS = 20  # regime-drift sample floor, post market_regime filter","code_src":"src/analytics/drift_detector.py:32-35"},{"id":"lessons_retriever","title":"LessonsRetriever (past lessons injected into prompts)","analogy":"A librarian who, before you take a test on one company, hands you the three most relevant old report cards.","plain":"Before the AI agents think about a stock, this finds up to 3 past reflections about the same stock (best), same sector or same signal, and up to 3 recent loss lessons, and pastes them into the prompt.","file":"src/memory/lessons.py","src":"src/memory/lessons.py:18","stores":[{"path_or_table":"TradeRecord.reflection / RootCauseRecord (read only)","what":"No file of its own; reads closed trades with a reflection and RootCauseRecord rows from trades.db."}],"written_by":[],"read_by":[{"func":"lessons_node -> get_relevant_lessons (stored in state['lessons'])","src":"src/orchestrator/graph.py:93"},{"func":"TechnicalAgent.analyze -> get_recent_rca_context + get_relevant_lessons","src":"src/agents/technical/agent.py:300"},{"func":"LLMJudge.evaluate -> get_recent_rca_context","src":"src/judge/evaluator.py:283"},{"func":"FundamentalAgent.analyze -> get_relevant_lessons","src":"src/agents/fundamental/agent.py:187"},{"func":"ScoutAgent.scan -> get_failure_patterns (appended to candidate rationale)","src":"src/agents/scout/agent.py:448"}],"constants":[{"name":"symbol weight","value":"score += 100","meaning":"Exact-symbol match relevance (sector adds 10, signal adds 5).","src":"src/memory/lessons.py:42"},{"name":"top lessons","value":"relevant[:3]","meaning":"At most 3 past lessons per prompt.","src":"src/memory/lessons.py:55"},{"name":"RCA context size","value":"n: int = 3","meaning":"Default number of recent RCA lessons.","src":"src/memory/lessons.py:63"}],"to_change":[{"goal":"Show more past lessons to the agents","edit":"Change relevant[:3] and n: int = 3 in src/memory/lessons.py. Tests: tests/test_agents.py (get_relevant_lessons)"}],"tests":["tests/test_agents.py"],"code":"        def relevance(r: TradeRecord) -> int:\n            score = 0\n            if r.symbol == symbol:\n                score += 100  # exact symbol = highest relevance\n            if sector and r.sector and r.sector == sector:\n                score += 10\n            if signal and r.signal and r.signal == signal:\n                score += 5\n            return score","code_src":"src/memory/lessons.py:39-47"},{"id":"lessons_writer","title":"LESSONS.md writer (LessonsWriter)","analogy":"A weekly newsletter the system writes about itself so a human (or Claude) can read what it has learned.","plain":"Rewrites the file LESSONS.md in the repo root from the knowledge base, forced-trade history, replay progress and the latest drift check, ending with simple recommendations.","file":"src/memory/lessons_writer.py","src":"src/memory/lessons_writer.py:40","stores":[{"path_or_table":"LESSONS.md (repo root)","what":"OUTPUT_FILE = Path('LESSONS.md'); human-readable markdown."}],"written_by":[{"func":"daily_lessons_job (cron hour=23, also called after deep_replay_job)","src":"runner.py:1143"},{"func":"Telegram /learn full (_handle_lessons_file)","src":"src/notifications/command_handler.py:1204"}],"read_by":[{"func":"Humans / Claude (LESSONS.md); no code imports it back","src":"src/memory/lessons_writer.py:41"}],"constants":[{"name":"high-confidence win cut","value":"e.confidence >= 0.7","meaning":"'What Works' lists wins at >= 0.7 confidence.","src":"src/memory/lessons_writer.py:96"},{"name":"loss list cut","value":"e.confidence >= 0.6","meaning":"'What Doesn't Work' lists losses at >= 0.6 confidence.","src":"src/memory/lessons_writer.py:104"},{"name":"hard-coded stock count","value":"/244 stocks","meaning":"Replay coverage denominator is a literal 244 (see gaps).","src":"src/memory/lessons_writer.py:114"}],"to_change":[{"goal":"Add a section to LESSONS.md","edit":"Append lines in LessonsWriter.write (src/memory/lessons_writer.py). Tests: tests/unit/test_lessons_writer.py"},{"goal":"Move when it refreshes","edit":"Edit daily_lessons cron (hour=23) in the scheduler block of runner.py."}],"tests":["tests/unit/test_lessons_writer.py"],"code":"def _is_win(desc: str) -> bool:\n    # Regime patterns use \"WON\"/\"LOST\"; FORCED_LEARNING patterns use \"WIN\"/\"LOSS\"\n    # instead — checking only \"WON\" left every forced-trade WIN entry falling\n    # through to the else-branch and rendering a ❌.\n    return not _is_loss(desc) and (\"WON\" in desc or \"WIN\" in desc)","code_src":"src/memory/lessons_writer.py:25-29"},{"id":"pattern_matcher","title":"PatternMatcher (memory recall)","analogy":"Like thinking 'this looks like the time I got burned on that bank stock' and nudging your confidence down a bit.","plain":"For each candidate it looks through the knowledge base for notes about the same stock, regime or trend, takes the 3 best matches and turns them into a small score nudge between -1.5 and +1.5.","file":"src/memory/pattern_matcher.py","src":"src/memory/pattern_matcher.py:18","stores":[],"written_by":[],"read_by":[{"func":"TechnicalAgent.analyze -> PatternMatcher().recall(symbol, indicators, regime)","src":"src/agents/technical/agent.py:238"},{"func":"TechnicalAgent._apply_recall adds recall['adjustment'] / 10 to the 0-1 technical score","src":"src/agents/technical/agent.py:257"}],"constants":[{"name":"same stock","value":"score += 0.6","meaning":"Relevance if the symbol appears in the pattern text.","src":"src/memory/pattern_matcher.py:50"},{"name":"same regime","value":"score += 0.25","meaning":"Relevance if observed_in_regime equals the current regime.","src":"src/memory/pattern_matcher.py:55"},{"name":"same trend","value":"score += 0.15","meaning":"Relevance if the trend word appears in the pattern text.","src":"src/memory/pattern_matcher.py:57"},{"name":"match floor","value":"score > 0.15","meaning":"A pattern needs relevance above 0.15 to count.","src":"src/memory/pattern_matcher.py:59"},{"name":"top matches","value":"matches[:3]","meaning":"Only the best 3 matches vote.","src":"src/memory/pattern_matcher.py:68"},{"name":"adjustment bound","value":"max(-1.5, min(1.5, round(net * 3, 2)))","meaning":"Final bounded adjustment on a 0-10 scale.","src":"src/memory/pattern_matcher.py:80"}],"to_change":[{"goal":"Make memory recall stronger/weaker","edit":"Change the net * 3 multiplier and the +/-1.5 bounds in PatternMatcher.recall (src/memory/pattern_matcher.py). Tests: tests/unit/test_pattern_matcher.py"}],"tests":["tests/unit/test_pattern_matcher.py"],"code":"        # Net signed adjustment: WON patterns push positive, LOST patterns push\n        # negative, weighted by relevance*confidence.\n        net = 0.0\n        for weight, e in top:\n            desc = e.pattern_description or \"\"\n            direction = 1.0 if \"WON\" in desc else -1.0\n            if \"LOST\" in desc:\n                direction = -1.0\n            net += direction * weight\n\n        adjustment = max(-1.5, min(1.5, round(net * 3, 2)))","code_src":"src/memory/pattern_matcher.py:70-80","unverified":"Direction is decided by the substrings 'WON' / 'LOST' in the description; patterns whose text uses 'WIN'/'LOSS' (FORCED_LEARNING, CONT-SIM) or 'worked'/'failed' (INTRADAY_SIMULATION) have neither substring 'WON' nor 'LOST', so they count as negative (-1.0) by the default in the code."},{"id":"rca","title":"Root-cause analysis (RootCauseAnalyzer)","analogy":"A detective who, after a loss, works out whether you were unlucky (the whole class had a bad day) or made a real mistake worth remembering.","plain":"When a real trade loses, a quick rule-based guess labels the failure type, then Claude (if a key exists) refines it. Only genuine signal failures are written into the knowledge base; market-noise losses are recorded but not learned from.","file":"src/memory/rca.py","src":"s n defaults. Ignored once data/cache/adaptive_thresholds.json exists (load() returns the file), so also edit or delete that file to reset.","src":"src/memory/adaptive_thresholds.py:23"}],"steps":["Find the active mode: cat data/cache/trading_mode.txt (observed content on this machine: rogue). If the file is absent, paper mode falls back to rogue and live to balanced.","Edit judge_threshold for that mode in src/trading/modes.py MODES (for example rogue 5.5 to 6.5). Keep conserve > balanced > rogue.","No-code alternative: switch mode at runtime with the Telegram /mode buttons (writes data/cache/trading_mode.txt via set_mode).","Run the tests below. Restart runner.py so the new constants are imported."],"constants_involved":[{"name":"conserve.judge_threshold","value":"8.0","src":"src/trading/modes.py:44"},{"name":"balanced.judge_threshold","value":"6.5","src":"src/trading/modes.py:49"},{"name":"rogue.judge_threshold","value":"5.5","src":"src/trading/modes.py:54"},{"name":"judge band half-width","value":"1.5","src":"src/judge/evaluator.py:253"},{"name":"APPROVAL_THRESHOLD","value":"7.5","src":"src/judge/evaluator.py:39"}],"tests_to_run":["tests/unit/test_trading_modes.py","tests/unit/test_adaptive_thresholds.py","tests/unit/test_weighted_thresholds.py","tests/unit/test_mode_gated_technical_vetoes.py","tests/unit/test_rogue_paper_default.py","uv run pytest tests/unit/test_trading_modes.py tests/unit/test_adaptive_thresholds.py tests/unit/test_weighted_thresholds.py tests/unit/test_mode_gated_technical_vetoes.py tests/unit/test_rogue_paper_default.py -v"],"side_effects":["Fewer approvals, so fewer pipeline trades (real or paper).","APPROVAL_THRESHOLD in evaluator.py is defined but a grep of src/, runner.py and tests/ finds no reader, so editing it does nothing.","The adaptive loop (AdaptiveThresholds.update_from_all_trades) keeps nudging the bar inside the +/-1.5 band around your new value."],"danger":"low: raising the bar only reduces trades; the stop-loss and pipeline order are untouched.","rule_flags":[]},{"id":"looser_judge","title":"Make the judge looser (lower the approval bar)","goal_plain":"Let more candidates through by lowering the score they need, for example to learn faster on paper.","analogy":"Like lowering the pass mark so more students pass: you see more results, but weaker ones sneak in.","files":[{"path":"src/trading/modes.py","symbol":"MODES[...].judge_threshold","what_to_edit":"Lower judge_threshold for the active mode. Keep conserve > balanced > rogue.","src":"src/trading/modes.py:49"},{"path":"src/trading/modes.py","symbol":"TradingModeConfig.trades_downtrends / skip_technical_vetoes","what_to_edit":"Optional flags that disable the FIGHTING_NIFTY, WEEKLY_TREND_CONFLICT, SUPERTREND_BEARISH, SELLING_PRESSURE and BELOW_ALL_SUPPORTS vetoes. Only rogue has them on.","src":"src/trading/modes.py:31"},{"path":"src/judge/evaluator.py","symbol":"LLMJudge._auto_veto","what_to_edit":"POOR_RISK_REWARD (rr < 1.5) is never mode-gated; do not remove it.","src":"src/judge/evaluator.py:61"},{"path":"src/memory/adaptive_thresholds.py","symbol":"AdaptiveThresholds.update_from_all_trades","what_to_edit":"The adaptive floor is 5.0: new_threshold = max(5.0, min(9.0, ...)). Judge band lower edge is mode.judge_threshold - 1.5.","src":"src/memory/adaptive_thresholds.py:137"}],"steps":["Decide the mode (see stricter_judge step 1).","Lower its judge_threshold in src/trading/modes.py MODES. Do not touch LIMITS.min_confidence (0.80 floor).","Run the tests below and restart runner.py.","Watch the /report win rate over many paper trades before keeping the change (CLAUDE.md asks for 20+ paper trades before any live use)."],"constants_involved":[{"name":"rogue.judge_threshold","value":"5.5","src":"src/trading/modes.py:54"},{"name":"min_confidence","value":"0.80","src":"config/risk_limits.py:33"},{"name":"judge band half-width","value":"1.5","src":"src/judge/evaluator.py:253"}],"tests_to_run":["tests/unit/test_trading_modes.py","tests/unit/test_a
