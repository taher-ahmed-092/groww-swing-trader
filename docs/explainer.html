tored as supertrend_direction (BULLISH or BEARISH).","src":"src/agents/technical/indicators.py:119"},{"term":"MACD","plain":"A trend indicator that compares a fast and a slow moving average.","analogy":"Two runners, one quick and one slow; when the quick one pulls away the trend is speeding up.","precise":"'macd' is one of the indicator features snapshotted to the journal.","src":"src/memory/journal.py:37"},{"term":"Bollinger bands","plain":"A price channel around the average; touching the edge means a stretched move.","analogy":"Like a rubber band that is pulled tight at the edges.","precise":"bb_lower is read by the mean_reversion strategy.","src":"src/strategies/mean_reversion.py:24"},{"term":"ATR","plain":"Average True Range: the typical size of a day's price swing.","analogy":"Like how many steps a ball usually bounces in one day.","precise":"atr_14. TieredStopManager: hard_stop = entry - atr_mult * atr, floored by the 7% max stop. Tier atr_multiplier is 2.0 large, 1.8 mid, 1.5 small.","src":"src/risk/tiered_stops.py:31"},{"term":"CMF","plain":"Chaikin Money Flow: whether money is flowing into or out of a stock.","analogy":"Like checking if more people are walking into a shop than out.","precise":"cmf_20 and cmf_signal; the judge flags SELLING_PRESSURE when cmf < -0.15 on a BUY.","src":"src/judge/evaluator.py:84"},{"term":"Ichimoku cloud","plain":"A set of lines that draw a 'cloud' on a chart used to read support and trend.","analogy":"A weather map of price: above the cloud is sunny, below is stormy.","precise":"Needs at least 52 rows (n >= 52); span B uses a rolling 52 window.","src":"src/agents/technical/indicators.py:274"},{"term":"VWAP","plain":"Volume-weighted average price: the average price paid weighted by how much traded.","analogy":"The price most shoppers actually paid today, not just the last price.","precise":"indicators.py stores vwap and price_vs_vwap; the judge adds flag BELOW_ALL_SUPPORTS when price is BELOW vwap and the nearest pivot level is BELOW_S1.","src":"src/judge/evaluator.py:34"},{"term":"OBV","plain":"On-balance volume: a running tally of volume on up days minus down days.","analogy":"Like a tug-of-war score: buyers pulling versus sellers pulling.","precise":"obv_trend is RISING if the slope over the last 5 values is positive, else FALLING.","src":"src/agents/technical/indicators.py:156"},{"term":"Pivot point / R1","plain":"A support or resistance price level worked out from the prior day.","analogy":"A line on the floor that players tend to bounce off.","precise":"risk_limits.py: R1 = 2*pivot - prior_low only caps the target when it sits at least min_resistance_distance_ratio (1.5) stop distances above entry.","src":"config/risk_limits.py:30"},{"term":"R:R (risk to reward)","plain":"How much you stand to win compared with how much you can lose.","analogy":"Risking one cookie to maybe win two.","precise":"target_reward_ratio = 2.0 (1:2). The checker also needs net R:R (after costs) of DIRECTIONAL_MIN_NET_RR = 1.5, or PAIRS_MIN_NET_RR = 1.15 for pairs trades.","src":"src/risk/checker.py:38"},{"term":"Stop-loss","plain":"A preset price where you sell to cap a loss.","analogy":"A safety net that catches you before you fall too far.","precise":"LIMITS.stop_loss_pct = 7.0 (hard stop below entry). GrowwBroker.place_order raises ValueError when stop_price is falsy.","src":"config/risk_limits.py:21"},{"term":"Target","plain":"The price where you plan to take profit.","analogy":"The finish line you aim for.","precise":"Default rule: target = entry + stop distance * target_reward_ratio (2.0).","src":"config/risk_limits.py:22"},{"term":"Breakeven stop","plain":"Moving the stop up to your entry price once you are up a bit so you cannot lose.","analogy":"Once you are safely ahead, you lock the door behind you.","precise":"TieredStopManager.BREAKEVEN_PCT = 3.0 (percent gain).","src":"src/risk/tiered_stops.py:21"},{"term":"Trailing stop","plain":"A stop that follows the price up but never down.","analogy":"A dog on a leash that is shortened as you walk forward.","precise":"TRAILING_TRIGGER_PCT = 5.0 and TRAILING_FACTOR = 0.5 in TieredStopManager.","src":"src/risk/tiered_stops.py:23"},{"term":"Partial exit","plain":"Selling part of the position to lock in some profit.","analogy":"Taking some of your winnings off the table.","precise":"TieredStopManager.PARTIAL_EXIT_PCT = 5.0.","src":"src/risk/tiered_stops.py:22"},{"term":"GTT","plain":"Good Till Triggered: a standing order the broker keeps until its price condition fires.","analogy":"Leaving a note with the shopkeeper: 'sell if the price hits this'.","precise":"GrowwBroker calls client.place_gtt_order after the entry order.","src":"src/broker/groww.py:81"},{"term":"OCO","plain":"One Cancels the Other: two linked orders where filling one cancels the other.","analogy":"Two exits at a door; once you use one the other locks.","precise":"GrowwBroker sends trigger_type='OCO' with a stop leg and a target leg.","src":"src/broker/groww.py:85"},{"term":"Paper trading","plain":"Practising with pretend money so no real order is sent.","analogy":"Playing Monopoly instead of real estate.","precise":"PaperBroker is the default broker; settings.broker_mode is 'live' only when live_trading_enabled AND Groww credentials exist.","src":"config/settings.py:97"},{"term":"Live trading","plain":"Real orders with real money.","analogy":"Playing the real game.","precise":"Requires LIVE_TRADING_ENABLED=true; settings.live_trading_enabled defaults to False.","src":"config/settings.py:46"},{"term":"Demo mode","plain":"A no-LLM test mode that uses simple rules instead of the AI.","analogy":"A toy steering wheel that spins but does not drive.","precise":"effective_demo_mode is False when live is on; otherwise it is paper_demo_mode or a missing Anthropic key. RiskChecker lowers min confidence to 0.60 in demo.","src":"config/settings.py:101"},{"term":"Kill switch","plain":"A file you create that stops all trading at once.","analogy":"The big red emergency stop button.","precise":"A file named LIMITS.kill_switch_file = 'KILL_SWITCH' in the repo root; checked by the kill_switch_guard decorator, by RiskChecker and by the practice engines.","src":"src/orchestrator/graph.py:49"},{"term":"Circuit breaker (daily loss)","plain":"An automatic pause after the day's losses get too big.","analogy":"Like a fuse that trips when too much power flows.","precise":"daily_loss_limit_pct = -6.0, computed from real journal trades only; data/cache/daily_loss_halt.txt holds today's date and clears when the date changes.","src":"src/risk/checker.py:40"},{"term":"Technical size factor (cb_factor)","plain":"A per-stock position-size reduction read from the technical verdict.","analogy":"Like a dimmer switch on position size.","precise":"RiskChecker reads technical['circuit_breaker']['size_factor'] and shrinks size when it is below 1.0.","src":"src/risk/checker.py:362"},{"term":"Sector cap","plain":"A limit on how many open positions share one sector.","analogy":"Do not put all your eggs in one basket.","precise":"LIMITS.max_positions_per_sector = 2; LIMITS.max_open_positions = 5.","src":"config/risk_limits.py:16"},{"term":"Affordability filter","plain":"Skipping stocks that cost too much for your small account.","analogy":"You cannot buy a 100 rupee toy with 50 rupees.","precise":"A helper in checker.py computes risk_inr for 1 share against max_risk_per_trade_pct (3.0 percent of portfolio) and collects 'unaffordable' symbols.","src":"src/risk/checker.py:75"},{"term":"Kelly sizing","plain":"A formula that picks bet size from your win rate and reward ratio.","analogy":"Bet more when the odds are good, less when they are not.","precise":"PositionSizer docstring: f = (W*R - L) / R. MIN_TRADE_INR 50.0, MAX_TRADE_INR 500.0, MIN_TRADES_FOR_KELLY 5, DEFAULT_WIN_RATE 0.55.","src":"src/risk/position_sizer.py:4"},{"term":"Market-cap tier","plain":"A size bucket for companies: large, mid or small.","analogy":"Elephant, horse, rabbit: smaller ones are jumpier so you handle them more carefully.","precise":"get_risk_params_for_tier: large {size x1.0, atr 2.0}, mid {x0.8, 1.8}, small {x0.5, 1.5}; unknown tiers use the small profile.","src":"src/data/watchlist.py:136"},{"term":"Regime","plain":"The overall mood of the market (trending, choppy, scared).","analogy":"The weather: you dress differently for rain and sun.","precise":"RegimeDetector.classify returns BULL_TRENDING, BEAR_TRENDING, VOLATILE, RANGE_BOUND, RECOVERY or TRANSITIONAL with size_multiplier 1.0, 0.5, 0.5, 0.75, 0.5, 0.75.","src":"src/data/regime_detector.py:81"},{"term":"BULL_TRENDING","plain":"Market is rising with strength.","analogy":"Sunny weather.","precise":"current > ma200, rsi > 50 and adx > 25; size multiplier 1.0.","src":"src/data/regime_detector.py:90"},{"term":"BEAR_TRENDING","plain":"Market is falling with strength.","analogy":"A storm.","precise":"current < ma200, rsi < 50, adx > 25; size multiplier 0.5.","src":"src/data/regime_detector.py:93"},{"term":"VOLATILE","plain":"Market has big swings without a clear direction.","analogy":"A windy, gusty day.","precise":"adx < 20 and recent 5-day range > 1.5 x ATR; size multiplier 0.5.","src":"src/data/regime_detector.py:96"},{"term":"RANGE_BOUND","plain":"Market is moving sideways in a narrow range.","analogy":"A ball bouncing between two walls.","precise":"adx < 20 and recent range < 0.8 x ATR; size multiplier 0.75.","src":"src/data/regime_detector.py:99"},{"term":"RECOVERY","plain":"Market is below its long average but above its medium one, climbing back.","analogy":"Getting better after being ill.","precise":"current < ma200 and current > ma50; size multiplier 0.5.","src":"src/data/regime_detector.py:102"},{"term":"TRANSITIONAL","plain":"Market fits none of the other moods.","analogy":"Spring: the weather is changing.","precise":"The else branch of classify; size multiplier 0.75.","src":"src/data/regime_detector.py:105"},{"term":"Adaptive thresholds","plain":"Judge pass marks that the system adjusts per regime from experience.","analogy":"A teacher who sets the pass mark based on how past classes did.","precise":"DEFAULT_THRESHOLDS judge_min: 6.5 BULL_TRENDING/RECOVERY/RANGE_BOUND, 7.5 VOLATILE, 7.0 TRANSITIONAL, 8.0 BEAR_TRENDING; MIN_EVIDENCE = 15 trades before adjusting; SOURCE_WEIGHTS: LIVE_FORCED 1.0, CONTINUOUS_SIM 0.5, SHORT 0.4, HISTORICAL_SIM 0.3.","src":"src/memory/adaptive_thresholds.py:32"},{"term":"Trading mode (conserve/balanced/rogue)","plain":"A dial that makes the system stricter or looser.","analogy":"A car with cautious, normal and sport driving modes.","precise":"TradingModeConfig judge_threshold: conserve 8.0, balanced 6.5, rogue 5.5; max_trades_per_week 2/3/5 (display only).","src":"src/trading/modes.py:43"},{"term":"LLM judge","plain":"A skeptical AI that grades the setup out of 10 and can veto it.","analogy":"A strict referee who may blow the whistle.","precise":"LLMJudge in src/judge/evaluator.py runs auto-vetoes before the LLM scorecard; model is settings.llm_model_judge.","src":"src/judge/evaluator.py:42"},{"term":"Auto-veto","plain":"A rule that rejects a trade before the AI is even asked.","analogy":"A bouncer who turns people away at the door.","precise":"Veto/flag codes in evaluator.py include COSTS_EAT_EDGE, COSTS_MINIMUM_NOT_MET, TECHNICAL_CONFLICT, FUNDAMENTAL_WEAK, MANUALLY_REQUESTED and NO_API_KEY.","src":"src/judge/evaluator.py:35"},{"term":"Hard reject","plain":"A fundamentals rule that instantly disqualifies a stock.","analogy":"A red card in football.","precise":"ScreenerScraper.check_hard_rejects returns reasons, e.g. D/E > 3.0 for non-financials and ROE < 5 for financials.","src":"src/data/screener.py:222"},{"term":"Gut check","plain":"A final holistic 'does this feel right?' step.","analogy":"A grown-up's hunch before crossing the road.","precise":"GutCheckAgent; graph edge technical_node -> gut_check_node -> judge_node; rule-based fallback in demo mode.","src":"src/agents/gut_check.py:31"},{"term":"Scout","plain":"The first agent that scans the watchlist for promising stocks.","analogy":"A lookout who points at likely targets.","precise":"ScoutAgent scores the WATCHLIST deterministically and returns top candidates.","src":"src/agents/scout/agent.py:56"},{"term":"Watchlist","plain":"The list of stocks the system is allowed to look at.","analogy":"The guest list for a party.","precise":"WATCHLIST in scout/agent.py (241 entries when imported); ALL_STOCKS in data/watchlist.py maps symbol to sector and tier.","src":"src/agents/scout/agent.py:48"},{"term":"Multi-timeframe (MTF) confirmation","plain":"Checking that daily and weekly charts agree.","analogy":"Asking two friends and seeing if they give the same answer.","precise":"The technical agent sets note MTF_CONFLICT when daily and weekly disagree.","src":"src/agents/technical/agent.py:250"},{"term":"Pattern matcher","plain":"Looks up past similar situations and nudges the score.","analogy":"Remembering 'last time it looked like this, we lost'.","precise":"PatternMatcher in src/memory/pattern_matcher.py recalls similar memories and adjusts the technical score (ARCHITECTURE.md: bounded +/-1.5).","src":"src/memory/pattern_matcher.py:18"},{"term":"Journal","plain":"The permanent notebook of every trade.","analogy":"A diary of every move.","precise":"TradingJournal (SQLModel/SQLite); storage at data/journal/trades.db per CLAUDE.md.","src":"src/memory/journal.py:216"},{"term":"TradeRecord","plain":"One row in the journal for one real (paper-broker) trade.","analogy":"One page in the diary.","precise":"SQLModel table; strategy_name defaults to 'momentum'.","src":"src/memory/journal.py:83"},{"term":"Knowledge base","plain":"A store of lessons the system has learned, each with a confidence.","analogy":"A binder of tips the team has collected.","precise":"KnowledgeEntry table in journal.py (the src/memory/knowledge package is empty).","src":"src/memory/journal.py:148"},{"term":"Root cause analysis (RCA)","plain":"Working out why a trade lost or won.","analogy":"Like a detective after a mistake.","precise":"RootCauseAnalyzer; cause labels include SENTIMENT_REVERSAL, OVERCONFIDENCE, COSTS_ATE_PROFIT, UNKNOWN.","src":"src/memory/rca.py:25"},{"term":"Reflection","plain":"An AI-written lesson after a trade closes.","analogy":"Writing 'what I learned' after a test.","precise":"PostTradeReflector in src/memory/reflection.py; without an Anthropic key it writes a PLACEHOLDER text.","src":"src/memory/reflection.py:21"},{"term":"Auto-rules","plain":"Rules the system extracts from its own knowledge base and applies without a human.","analogy":"A kid who writes his own playground rules from experience.","precise":"AutoRuleExtractor: MIN_CONFIDENCE = 0.75, MIN_OBSERVATIONS = 10; output data/cache/auto_rules.json.","src":"src/memory/auto_rules.py:26"},{"term":"Company dossier","plain":"A personal file kept for each stock with its history and stats.","analogy":"A report card per stock.","precise":"Per-stock JSON (data/dossiers/{SYMBOL}.json per ARCHITECTURE.md); aggregates include bayesian_win_prob; scout flags DOSSIER_POOR_HISTORY / DOSSIER_STRONG_HISTORY at 8+ trades.","src":"src/memory/company_dossier.py:37"},{"term":"Drift (concept drift)","plain":"When what used to work stops working.","analogy":"A sports team whose old tactics stop winning.","precise":"DriftDetector checks win-rate drift (>15pp drop), pattern drift and regime drift; decays knowledge confidence by 20%; DECAY_COOLDOWN_HOURS = 24.","src":"src/analytics/drift_detector.py:40"},{"term":"Forced trade","plain":"A practice trade the system places on purpose to gather learning data.","analogy":"A practice match, not a real game.","precise":"AlwaysOnTrader (engine LIVE_FORCED): MAX_DAILY_TRADES = 30, MAX_HOLD_DAYS = 5, simulation only (never touches broker or judge).","src":"src/trading/always_on_trader.py:60"},{"term":"LIVE_FORCED","plain":"The forced-trade engine that runs during market hours.","analogy":"Practice during real match time.","precise":"Scorecard source rows with trade_type LIVE_FORCED or RANDOM_FORCED in forced_trades_history.json.","src":"src/analytics/strategy_scorecard.py:52"},{"term":"HISTORICAL_SIM","plain":"An old practice engine on past data that has been shut down.","analogy":"A retired player.","precise":"Retired on scorecard evidence (PF 0.31 pre-fix, 0.21 post-fix, 62.6% noisy time-exits); listed in RETIRED_ENGINES.","src":"src/analytics/strategy_scorecard.py:47"},{"term":"CONTINUOUS_SIM","plain":"A practice simulator that runs often, including off-hours.","analogy":"A video-game practice mode that never closes.","precise":"ContinuousSimulator; scorecard source data/cache/continuous_sim_history.json.","src":"src/learning/continuous_simulator.py:45"},{"term":"EXPLORER (control engine)","plain":"An unfiltered engine used to compare against the filtered ones.","analogy":"The kid who tries everything with no rules, so you can see what the rules are worth.","precise":"CONTROL_ENGINES = {'EXPLORER'}: gets a scorecard row but is never throttled or paused.","src":"src/analytics/strategy_scorecard.py:64"},{"term":"Historical replay","plain":"Replaying past days to see what the system would have done.","analogy":"Watching an old match and guessing the plays.","precise":"HistoricalReplayEngine; per the audit it slices df_full.iloc[:idx+1] before computing indicators (no look-ahead).","src":"src/learning/historical_replay.py:44"},{"term":"Intraday simulator","plain":"A same-day practice simulator.","analogy":"A quick one-day game.","precise":"IntradaySimulator writes data/cache/intraday_sim_history.json.","src":"src/learning/intraday_simulator.py:39"},{"term":"Daily trade guarantee","plain":"A helper that builds practice-trade candidates each day.","analogy":"A coach who makes sure everyone gets a turn.","precise":"DailyTradeGuarantee builds mean_reversion and pairs candidates.","src":"src/trading/daily_guarantee.py:39"},{"term":"Pairs trading","plain":"Buying the laggard of two normally linked stocks.","analogy":"Two friends who usually walk together; one falls behind, so bet he catches up.","precise":"PairsTradingStrategy; _CORR_MIN = 0.7 (correlation floor); checker.py comment also cites a z-score >= 2.0 gate.","src":"src/strategies/pairs_trading.py:30"},{"term":"Z-score","plain":"How many standard steps something is away from normal.","analogy":"How far a kid is from the class's average height.","precise":"daily_guarantee scores pairs as min(abs(z_score)/3.0, 1.0).","src":"src/trading/daily_guarantee.py:84"},{"term":"Strategy attribution","plain":"Tagging each trade with the style of idea behind it.","analogy":"Labeling each play as offence, defence, etc.","precise":"STRATEGIES = ('mean_reversion', 'breakout', 'pairs_trading', 'momentum').","src":"src/analytics/strategy_attribution.py:10"},{"term":"Profit factor (PF)","plain":"Total money won divided by total money lost.","analogy":"If you won 20 coins and lost 10, your score is 2.","precise":"Scorecard thresholds: PF_PAUSE_THRESHOLD 0.5, PF_THROTTLE_THRESHOLD 0.8, PF_RESTORE_THRESHOLD 1.2, with MIN_TRADES_FOR_THROTTLE = 50.","src":"src/analytics/strategy_scorecard.py:26"},{"term":"Expectancy","plain":"The average profit per trade over many trades.","analogy":"Your average score per game.","precise":"always_on_trader.py cites audit numbers: -0.21% net versus +0.24% gross per trade.","src":"src/trading/always_on_trader.py:366"},{"term":"Max drawdown","plain":"The biggest drop from a peak in your equity.","analogy":"The deepest valley after the highest hill.","precise":"Reported by get_professional_metrics in src/analytics/performance.py.","src":"src/analytics/performance.py:238"},{"term":"Strategy decay","plain":"A recent fall in win rate compared with before.","analogy":"A team that starts losing more.","precise":"decay_alert fires when the recent 20-trade win rate is more than 0.15 below the prior 20.","src":"src/analytics/performance.py:234"},{"term":"Scorecard (engine scorecard)","plain":"A report card comparing the practice engines.","analogy":"A leaderboard.","precise":"EngineScorecard in strategy_scorecard.py; throttle state in data/cache/engine_throttle.json.","src":"src/analytics/strategy_scorecard.py:95"},{"term":"Throttle / pause","plain":"Slowing or stopping an engine whose results are poor.","analogy":"Benching a player who keeps missing.","precise":"apply_throttles writes engine_throttle.json; the REAL engine and control engines are never throttled.","src":"src/analytics/strategy_scorecard.py:22"},{"term":"Probation","plain":"Half-size trading while an engine proves itself.","analogy":"A new player who plays half the game first.","precise":"PROBATION_MIN_TRADES = 20 current-era trades; below it an engine is on probation (half-size entries).","src":"src/analytics/strategy_scorecard.py:33"},{"term":"Era","plain":"A time window used to ignore data from before a big bug fix.","analogy":"Counting only the games after the new coach arrived.","precise":"ERA_FIX_COMMIT = 'f262968'; era start stored in data/cache/era_marker.json; ERA_FALLBACK_START = 2026-07-26T00:23:57+05:30.","src":"src/analytics/era.py:24"},{"term":"Slippage","plain":"The small difference between the price you expect and the price you get.","analogy":"The price tag changes slightly as you reach the till.","precise":"SLIPPAGE_BY_TIER = large 0.0005, mid 0.0010, small 0.0015 per side.","src":"src/trading/cost_model.py:19"},{"term":"STT","plain":"Securities Transaction Tax charged by the government.","analogy":"A small toll on each trade.","precise":"Delivery: turnover * 0.001 (both sides); intraday: sell_value * 0.00025.","src":"src/trading/cost_model.py:48"},{"term":"Stamp duty","plain":"A government charge on buying.","analogy":"A small tax stamp on the receipt.","precise":"stamp = buy_value * 0.00015.","src":"src/trading/cost_model.py:51"},{"term":"GST (on trading costs)","plain":"A tax on brokerage and exchange fees.","analogy":"Sales tax on the fees.","precise":"gst = (brokerage + exchange) * 0.18; exchange = turnover * 0.0000297.","src":"src/trading/cost_model.py:52"},{"term":"Round-trip costs","plain":"All the fees for buying and then selling.","analogy":"The cost of a return ticket.","precise":"compute_round_trip_costs(entry, exit, quantity, tier, is_intraday) returns TradeCosts with total_pct.","src":"src/trading/cost_model.py:34"},{"term":"Net vs gross P&L","plain":"Gross is profit before fees; net is after fees.","analogy":"Pocket money before and after paying the bus fare.","precise":"Per ARCHITECTURE.md trades carry pnl_pct (net) and gross_pnl_pct; a target-hit trade that nets negative is tagged COSTS_ATE_PROFIT.","src":"src/memory/rca.py:25"},{"term":"Calibrated ensemble","plain":"ML models whose probabilities are adjusted to be honest.","analogy":"A weather forecaster who learned to say 70% only when it rains 70% of the time.","precise":"CalibratedEnsemble wraps CalibratedClassifierCV (isotonic, cv=3) around a RandomForest and a LogisticRegression.","src":"src/ml/calibration.py:51"},{"term":"Brier score","plain":"A score for how good probability guesses are (lower is better).","analogy":"A grade for forecasts.","precise":"brier_scores from the calibrated ensemble are shown in /learn.","src":"src/notifications/command_handler.py:532"},{"term":"Random Forest","plain":"An ML model made of many decision trees voting.","analogy":"Asking a crowd of simple advisers and taking the vote.","precise":"RandomForestModel; MODEL_FILE data/models/random_forest.json; the judge imports it for a blended score.","src":"src/ml/random_forest_model.py:20"},{"term":"XGBoost / SignalCombiner","plain":"A different ML model that predicts win probability from real trades.","analogy":"A second, smarter adviser.","precise":"SignalCombiner in src/ml/signal_combiner.py; ARCHITECTURE.md: 70/30 chronological split, saved only if validation accuracy > 55%.","src":"src/ml/signal_combiner.py:67"},{"term":"Walk-forward validation","plain":"Training on the past and testing liday calendar.","precise":"NSECalendar in src/data/market_calendar.py.","src":"src/data/market_calendar.py:26"},{"term":"Token bucket (rate limiter)","plain":"A way to limit how fast you call a data service.","analogy":"A jar of tickets: no ticket, wait.","precise":"_RateLimiter, default 60 calls/min via YFINANCE_MAX_CALLS_PER_MIN; sleeps rather than failing.","src":"src/data/fetcher.py:51"},{"term":"Scan lock","plain":"A file that stops two heavy jobs running together.","analogy":"A 'do not disturb' sign on the door.","precise":"_ScanLock in runner.py guards _build_weekly_candidates and market_open_scan_job.","src":"runner.py:149"},{"term":"Job telemetry","plain":"Records of how each scheduled job ran.","analogy":"A timecard for each worker.","precise":"track_job wraps jobs and records to data/cache/job_telemetry.json (last 500 runs per ARCHITECTURE.md).","src":"src/analytics/job_telemetry.py:48"},{"term":"Stale position","plain":"An open trade held longer than allowed.","analogy":"Milk left too long in the fridge.","precise":"STALE_POSITION_MAX_HOLD_DAYS = 5.","src":"src/risk/checker.py:110"},{"term":"Telegram bot","plain":"The chat app channel for alerts and commands.","analogy":"A walkie-talkie to the system.","precise":"TelegramNotifier (alerts, wait_for_approval) and CommandHandler (_MENU of 22 commands).","src":"src/notifications/telegram_bot.py:53"},{"term":"Dashboard token","plain":"A secret in the URL that gates the web dashboard.","analogy":"A password in the web address.","precise":"Routes are /dashboard/{token} and /api/action/{token}/...","src":"dashboard/server.py:597"},{"term":"Cloudflared tunnel","plain":"A tool that makes the local dashboard reachable from the internet.","analogy":"A secret tunnel from your home to a public door.","precise":"Optional: if not installed the dashboard still runs locally.","src":"scripts/start_everything.py:10"},{"term":"Market context","plain":"The first pipeline step that fetches the overall market picture.","analog function ruleSrc(id){var r=arr(ST.simulator_rules).filter(function(x){return x.id===id;})[0];return r?r.src:null;}
function rc(name){var r=arr(SF.risk_constants).filter(function(x){return x.name===name;})[0];return r?r.value:null;}
var SLIP={large:0.0005,mid:0.001,small:0.0015};
function costs(entry,exit,qty,tier,intraday){
  var buy=entry*qty,sell=exit*qty,turn=buy+sell,brokerage,stt;
  if(intraday){brokerage=Math.min(20,buy*0.0005)+Math.min(20,sell*0.0005);stt=0.00025*sell;}else{brokerage=0;stt=0.001*turn;}
  var exch=0.0000297*turn,stamp=0.00015*buy,gst=0.18*(brokerage+exch),slip=(SLIP[tier]||0.0005)*turn;
  var total=brokerage+stt+exch+stamp+gst+slip;
  return {brokerage:brokerage,stt:stt,exchange:exch,stamp:stamp,gst:gst,slippage:slip,total:total,total_pct:total/buy*100};}
var MODES={conserve:{base:8.0,adx:true,downtrends:false,skipTech:false,size:0.5},balanced:{base:6.5,adx:false,downtrends:false,skipTech:false,size:1.0},rogue:{base:5.5,adx:false,downtrends:true,skipTech:true,size:1.0}};
var REGBAR={BULL_TRENDING:6.5,RECOVERY:6.5,RANGE_BOUND:6.5,VOLATILE:7.5,TRANSITIONAL:7.0,BEAR_TRENDING:8.0,UNKNOWN:6.5};
var REGSIZE={BULL_TRENDING:1.0,BEAR_TRENDING:0.5,VOLATILE:0.5,RANGE_BOUND:0.75,RECOVERY:0.5,TRANSITIONAL:0.75,UNKNOWN:0.75};
var REGSTRAT={BULL_TRENDING:['momentum','breakout','pairs_trading'],RECOVERY:['breakout','pairs_trading'],RANGE_BOUND:['mean_reversion','pairs_trading'],VOLATILE:['mean_reversion','pairs_trading'],BEAR_TRENDING:['pairs_trading'],TRANSITIONAL:['pairs_trading'],UNKNOWN:['pairs_trading']};
var TIERSIZE={large:1.0,mid:0.8,small:0.5};

  function stage(id,title){var st={id:id,title:title,rows:[],level:'pass'};out.push(st);return st;}
  function row(st,level,text,src){st.rows.push({level:level,text:text,src:src});if(level==='reject'){st.level='reject';rejected.push({stage:st.title,text:text});}else if(level==='flag'&&st.level==='pass')st.level='flag';}
  var adxSig=i.adx>25?'TRENDING':(i.adx<20?'CHOPPY':'NEUTRAL');
  // market context
  var s0=stage('market_context_node','1 · Market context');
  row(s0,'info','Regime '+i.regime+': position-size multiplier ×'+REGSIZE[i.regime]+'; strategies allowed: '+REGSTRAT[i.regime].join(', ')+'.',ruleSrc('risk_size_regime')||ruleSrc('tech_regime_strategies'));
  row(s0,'info','Nifty (index) trend you chose: '+i.nifty+'. The judge only looks at it in the vetoes below.',ruleSrc('judge_fighting_nifty'));
  // scout
  var s1=stage('scout_node','4 · Scout');
  row(s1,'info','Scout only ranks candidates. It never rejects (no gate after scout in graph.py).',ruleSrc('scout_no_gate'));
  if(i.rsi>=50&&i.rsi<=65)row(s1,'info','RSI '+i.rsi+' is inside scout\'s 50–65 sweet spot (adds to scout score).',ruleSrc('scout_rsi_zone'));
  if(i.rsi>70||i.rsi<30)row(s1,'flag','RSI '+i.rsi+' is extreme (>70 or <30): scout flags it.',ruleSrc('scout_rsi_extreme'));
  if(i.adx<20)row(s1,'flag','ADX '+i.adx+' < 20: scout flags low trend strength.',ruleSrc('scout_low_adx'));
  // fundamental
  var s2=stage('fundamental_node','5 · Fundamental');
  var hard=[],fscore,fproceed,dataMissing=!!i.noFund;
  if(!dataMissing){
    if(i.pledged>30)hard.push(['Promoter pledging '+i.pledged+'% > 30','fund_hard_pledge']);
    if(i.holding>=1&&i.holding<25&&i.pledged>15)hard.push(['Promoter holding '+i.holding+'% (<25) with pledging '+i.pledged+'% (>15)','fund_hard_low_holding']);
    if(i.fin){if(i.roe<5)hard.push(['ROE '+i.roe+'% < 5 (financial company rule)','fund_hard_roe_financial']);}
    else{if(i.dte>3.0)hard.push(['Debt/Equity '+i.dte+' > 3.0','fund_hard_debt']);if(i.roce<6)hard.push(['ROCE '+i.roce+'% < 6','fund_hard_roce']);}
    if(i.piot<=2)hard.push(['Piotroski F-score '+i.piot+' ≤ 2 (assuming ≥5 signals were evaluable)','fund_hard_piotroski']);}
  if(dataMissing){fscore=0.5;fproceed=true;row(s2,'info','No fundamental data: neutral score 0.50, proceeds (absence is "unknown", not "bad").',ruleSrc('fund_no_data'));}
  else{
    var pts=0,parts=[];
    if(i.roce>=20){pts+=3;parts.push('ROCE ≥20: +3');}else if(i.roce>=15){pts+=2;parts.push('ROCE ≥15: +2');}else if(i.roce>=10){pts+=1;parts.push('ROCE ≥10: +1');}else parts.push('ROCE <10: +0');
    if(i.dte<0.5){pts+=2;parts.push('D/E <0.5: +2');}else if(i.dte<1.0){pts+=1;parts.push('D/E <1.0: +1');}else parts.push('D/E ≥1.0: +0');
    if(i.sg>10&&i.pg>10){pts+=2;parts.push('both growths >10%: +2');}else if(i.sg>0&&i.pg>0){pts+=1;parts.push('both growths >0: +1');}else parts.push('growth: +0');
    var pp=0;if(i.holding>=50)pp++;if(i.pledged<5)pp++;pts+=pp;parts.push('promoter: +'+pp);
    if(i.pe>0&&i.pe<=35){pts+=1;parts.push('P/E 0–35: +1');}else parts.push('P/E: +0');
    if(i.piot>=7){pts+=2;parts.push('Piotroski ≥7: +2');}else if(i.piot>=4){pts+=1;parts.push('Piotroski ≥4: +1');}else{pts-=1;parts.push('Piotroski ≤3: −1');}
    if(i.fcf>8){pts+=1.5;parts.push('FCF yield >8%: +1.5');}else if(i.fcf>5){pts+=1;parts.push('FCF yield >5%: +1');}else parts.push('FCF yield: +0');
    fscore=Math.round(Math.max(0,Math.min(1,pts/10))*10000)/10000;fproceed=fscore>=0.55;
    row(s2,'info','Rule-based score = '+pts+'/10 → '+fscore+'  ('+parts.join('; ')+')',ruleSrc('fund_pts_roce'));
    row(s2,fproceed?'info':'flag','proceed = score ≥ 0.55 → '+fproceed+(fproceed?'':' (a low score is passed on, not a hard stop; the hard stops are below)'),ruleSrc('fund_proceed'));}

  var hardRejected=hard.length>0;
  // technical
  var s3=stage('technical_node','6 · Technical');
  row(s3,'info','ADX '+i.adx+' → class '+adxSig+' (TRENDING >25, CHOPPY <20, else NEUTRAL).',ruleSrc('tech_adx_class'));
  var strat=null,tscore,tsignal,tproceed;
  var allowed=REGSTRAT[i.regime];
  if(allowed.indexOf('momentum')>=0&&i.trend==='UPTREND'&&i.rsi>=50&&i.rsi<=65&&i.adx>25&&i.maStack){
    var sc=0.5;if(i.adx>30)sc+=0.2;if(i.vol>1.3)sc+=0.15;if(i.obv)sc+=0.15;strat={name:'momentum',score:Math.round(Math.min(1,sc)*10000)/10000};
    row(s3,'info','Momentum strategy fires BUY (uptrend, RSI 50–65, ADX >25, price>MA50>MA200). Score '+strat.score+'.',ruleSrc('tech_momentum_trend'));}
  else if(allowed.indexOf('mean_reversion')>=0&&i.rsi<40&&i.aboveMa200&&i.nearSupport){
    strat={name:'mean_reversion',score:Math.round(Math.min(1,0.5+(40-i.rsi)/40*0.5)*10000)/10000};
    row(s3,'info','Mean-reversion strategy fires BUY (RSI <40, above MA200, near support). Score '+strat.score+'.',ruleSrc('tech_meanrev'));}
  else row(s3,'info','No modelled strategy fires in regime '+i.regime+' → falls back to the rule-based score. (Breakout and pairs strategies are not modelled: they need data these sliders do not have.)',ruleSrc('tech_regime_strategies'));

  else{
    var tp=0;if(i.rsi>=50&&i.rsi<=65)tp+=3;else if(i.rsi>=45&&i.rsi<50)tp+=2;else if(i.rsi>=40&&i.rsi<45)tp+=1;
    if(i.trend==='UPTREND')tp+=3;else if(i.trend==='SIDEWAYS')tp+=1;
    if(adxSig==='TRENDING')tp+=2;else if(adxSig==='NEUTRAL')tp+=1;
    if(i.vol>=1.2)tp+=1;if(i.obv)tp+=1;
    tscore=Math.round(tp/10*10000)/10000;
    var isBuy=tscore>=0.65&&i.trend!=='DOWNTREND'&&adxSig!=='CHOPPY';
    tsignal=isBuy?'BUY':(tscore>=0.4?'HOLD':'SKIP');tproceed=tsignal==='BUY';
    row(s3,'info','Rule-based score = '+tp+'/10 = '+tscore+' → signal '+tsignal+' (BUY needs score ≥0.65, trend not DOWNTREND, ADX not CHOPPY).',ruleSrc('tech_rule_buy_gate'));}
  var mtf=0;
  if(i.trend==='UPTREND'&&i.weekly==='UPTREND'){mtf=0.1;row(s3,'info','Weekly trend agrees with daily: score +0.10.',ruleSrc('tech_mtf_bonus'));}
  else if(i.trend==='UPTREND'&&i.weekly==='DOWNTREND'){mtf=-0.15;row(s3,'flag','Daily uptrend vs weekly downtrend (MTF_CONFLICT): score −0.15.',ruleSrc('tech_mtf_conflict'));}

  var tr=parseFloat(rc('target_reward_ratio'));var minR=isNaN(tr)?null:Math.max(tr,8*costs(entry,entry*1.06,1,i.tier,false).total_pct/i.stopPct);
  if(minR)row(s3b,'info','The real technical stage would set the target ratio to max(target_reward_ratio='+tr+', 8×cost%/stop%) = '+minR.toFixed(2)+'. Your slider overrides that so you can test weaker setups.',ruleSrc('tech_target_ratio'));

    thr=Math.round(Math.max(M.base-1.5,Math.min(M.base+1.5,REGBAR[i.regime]))*100)/100;
    overall=Math.round(Math.max(0,(fscore*0.5+tscore*0.5)*10)*100)/100;jApproved=overall>=thr;
    row(s5,jApproved?'info':'reject','Demo score = (fundamental×0.5 + technical×0.5)×10 = '+overall+' vs bar '+thr+' (mode '+i.mode+' base '+M.base+', regime default '+REGBAR[i.regime]+', clamped to base ±1.5). The live bar can differ because AdaptiveThresholds learns it.',ruleSrc('judge_threshold'));
    if(netMove<1.0)row(s5,'flag','COSTS_MINIMUM_NOT_MET: net move after costs '+netMove.toFixed(2)+'% < 1.0%.',ruleSrc('judge_cost_margin'));}

  var approved=rejected.length===0;
  return {stages:out,rejected:rejected,approved:approved,summary:{fscore:fscore,tscore:tscore,tsignal:tsignal,gut:gut,overall:overall,thr:thr,netRR:netRR}};}

function sec3(){
  var s=section('s3',3,'Trade simulator','Walk a fake candidate through scout → fundamental → technical → gut → judge → risk using the real thresholds.');
  s.appendChild(box(analogy('Pretend you hand the factory a toy stock and watch which worker says "stop".'),h('p',{class:'kv warn'},'Models the paper/demo pipeline (rule-based scores, no Anthropic key). The LLM-written scores of live mode cannot be reproduced. Learned thresholds, breakout and pairs strategies, memory recall, position sizing and the affordability filter are not modelled. The real graph keeps running later stations after a rejection; the executor then refuses a rejected trade.')));
  var st={rsi:57,adx:28,trend:'UPTREND',weekly:'UPTREND',regime:'BULL_TRENDING',mode:'balanced',nifty:'UPTREND',vol:1.3,obv:true,maStack:true,nearSupport:false,aboveMa200:true,supBear:false,cmf:0.05,belowS:false,
    fin:false,noFund:false,roce:22,dte:0.4,pledged:2,holding:55,roe:15,piot:7,sg:12,pg:14,pe:25,fcf:6,rr:2.5,stopPct:5,tier:'large',pnl:-1,realToday:1,open:0,sector:0,kill:false};

function reveal(el){
  var chain=[];for(var p=el;p&&p!==document.body;p=p.parentElement)chain.push(p);
  chain.reverse().forEach(function(p){if(p.tagName==='DETAILS')p.open=true;if(p._activate)p._activate();});
  el.style.display='';el.scrollIntoView({block:'center'});el.classList.add('hit');setTimeout(function(){el.classList.remove('hit');},1800);}
function buildSearch(){
  var q=document.getElementById('q'),box=document.getElementById('results');var idx=[];
  Array.prototype.forEach.call(document.querySelectorAll('[data-title]'),function(el){var sec=el.closest('section');idx.push({el:el,title:el.getAttribute('data-title'),sec:sec?sec._title:'',text:(el.textContent||'').toLowerCase()});});
  function go(){
    var v=q.value.trim().toLowerCase();box.textContent='';if(v.length<2){box.style.display='none';return;}
    var hits=idx.filter(function(x){return x.text.indexOf(v)>=0||x.title.toLowerCase().indexOf(v)>=0;});
    var inner=hits.filter(function(a){return !hits.some(function(b){return b!==a&&a.el.contains(b.el);});});
    inner=inner.slice(0,40);
    if(!inner.length){box.appendChild(h('a',null,'No matches'));box.style.display='block';return;}
    inner.forEach(function(x){var i=x.text.indexOf(v);var snip=i>=0?x.text.slice(Math.max(0,i-40),i+80):'';
      box.appendChild(h('a',{href:'javascript:void(0)',onclick:function(){box.style.display='none';document.getElementById('side').classList.remove('open');reveal(x.el);}},h('b',null,x.title.slice(0,110)),h('small',null,x.sec+(snip?' · …'+snip.replace(/\s+/g,' ')+'…':''))));});
    box.style.display='block';}
  q.addEventListener('input',go);document.addEventListener('keydown',function(e){if(e.key==='Escape')box.style.display='none';if(e.key==='/'&&document.activeElement!==q&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();q.focus();}});}
